<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="1360" height="680" role="img" aria-label="上下文窗口：超出上限的部分从最早的开始被切掉，模型看不到"><rect width="680" height="340" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">它此刻能看到的全部：上下文窗口</text><rect x="176" y="88" width="480" height="100" rx="12" fill="#fcfcfd" stroke="#2563eb" stroke-width="2"/><text x="416" y="78" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#2563eb">上下文窗口（按 token 算，有上限）</text><rect x="192" y="112" width="170" height="52" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="277" y="143.04" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#1f2937">你发的文档</text><rect x="370" y="112" width="130" height="52" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="435" y="143.04" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#1f2937">之前的对话</text><rect x="508" y="112" width="132" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="574" y="143.04" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#2563eb">它已经说的</text><rect x="28" y="112" width="64" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/><text x="60" y="142.32" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">文档开头</text><rect x="100" y="112" width="64" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/><text x="132" y="142.32" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">……</text><line x1="170" y1="96" x2="170" y2="180" stroke="#be123c" stroke-width="2" stroke-dasharray="5 4"/><text x="96" y="218" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="600" fill="#be123c">被挤出窗口</text><text x="96" y="236" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">对它来说从来没进去过</text><line x1="600" y1="216" x2="640" y2="192" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/><text x="560" y="236" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">下一个词从这里长出来，</text><text x="560" y="254" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">长一个就往左挤一格</text><text x="24" y="316" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2937">超出的部分从最早的开始切。你以为它"忘了"，其实那段它根本没看见。</text></svg>