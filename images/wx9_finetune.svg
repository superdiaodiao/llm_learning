ft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">不到 1%，存下来几十兆</text><rect x="512" y="66" width="144" height="160" rx="8" fill="#fcfcfd" stroke="#9ca3af" stroke-width="1.3"/><text x="584" y="90" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#2563eb">微调教得动的</text><text x="584" y="112" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#1f2937">语气</text><text x="584" y="132" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#1f2937">固定格式</text><text x="584" y="152" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#1f2937">回答套路</text><text x="584" y="172" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#1f2937">什么该拒绝</text><text x="584" y="200" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#be123c">教不动的：知识</text><text x="584" y="216" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#6b7280">几千段挪不动几万亿词</text><line x1="24" y1="248" x2="656" y2="248" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><text x="24" y="278" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2937">微调 = 拿练好的模型，用你的一小批材料再挪几步。几百到几万段够。</text><text x="24" y="304" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937">它教的是"怎么说"，不是"说什么"。微调完它会用你的语气，说的内容照样编。</text><text x="24" y="328" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">（大表不动只挪小表的做法叫 LoRA。）</text></svg>