<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="1360" height="720" role="img" aria-label="一层层叠上去，越往上越抽象"><rect width="680" height="360" fill="#ffffff"/><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">一层不够，叠几十层</text><rect x="80" y="64" width="520" height="48" rx="10" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5"/><text x="104" y="94" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#2563eb">第 32 层</text><text x="196" y="94" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#6b7280">拼出语义和逻辑</text><text x="340" y="156" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="400" fill="#9ca3af">⋮</text><rect x="80" y="192" width="520" height="48" rx="10" fill="#f3f5fb" stroke="#9ca3af" stroke-width="1.5"/><text x="104" y="222" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#1f2937">第 2 层</text><text x="196" y="222" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#6b7280">邻居已经被第 1 层揉过一遍</text><line x1="340" y1="188" x2="340" y2="178" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a3)"/><rect x="80" y="256" width="520" height="48" rx="10" fill="#f6f7f9" stroke="#9ca3af" stroke-width="1.5"/><text x="104" y="286" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#1f2937">第 1 层</text><text x="196" y="286" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#6b7280">只看得到原始的邻居词</text><line x1="340" y1="252" x2="340" y2="242" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a3)"/><defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker></defs><text x="24" y="336" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2937">每层的输入都是上一层的半成品。这就是"深度学习"里的那个"深"。</text></svg>