<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" width="1360" height="780" role="img" aria-label="遇到不知道的事，概率表摊得很平，但抽签照抽，而且表里没有不知道这个出口"><rect width="680" height="390" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">遇到它不知道的事</text><text x="28" y="76" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">问</text><rect x="28" y="86" width="220" height="42" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="138" y="112.4" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#1f2937">「你邻居叫什么名字？」</text><text x="300" y="76" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">它给出的概率表</text><text x="352" y="106" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#be123c">张伟</text><rect x="360" y="88" width="20.8" height="26" rx="5" fill="#ffe4e6" stroke="#be123c" stroke-width="1.4"/><text x="390.8" y="106" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="13" font-weight="600" fill="#be123c">8%</text><text x="352" y="140" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#1f2937">李明</text><rect x="360" y="122" width="18.2" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="388.2" y="140" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="13" font-weight="400" fill="#6b7280">7%</text><text x="352" y="174" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#1f2937">王芳</text><rect x="360" y="156" width="18.2" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="388.2" y="174" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="13" font-weight="400" fill="#6b7280">7%</text><text x="352" y="208" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#1f2937">刘洋</text><rect x="360" y="190" width="15.6" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="385.6" y="208" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="13" font-weight="400" fill="#6b7280">6%</text><text x="352" y="242" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#1f2937">陈静</text><rect x="360" y="224" width="15.6" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="385.6" y="242" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="13" font-weight="400" fill="#6b7280">6%</text><text x="360" y="272" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">⋯ 还有几万行，都差不多矮</text><text x="352" y="316" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#1f2937">不知道</text><rect x="360" y="298" width="72.8" height="26" rx="5" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 3"/><text x="442.8" y="316" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#9ca3af">—</text><text x="466.8" y="316" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#be123c">← 表里没有这个出口</text><line x1="160" y1="150" x2="160" y2="196" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/><text x="160" y="216" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">抽签照抽</text><rect x="28" y="228" width="264" height="46" rx="8" fill="#ffe4e6" stroke="#be123c" stroke-width="1.6"/><text x="160" y="256.76" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#be123c">"您的邻居叫张伟。"</text><text x="160" y="296" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">语法通顺、语气自信、错得毫无痕迹</text><text x="24" y="364" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2937">最高才 8%，也得挑一个。流畅和真实，来自同一套机制。</text></svg>