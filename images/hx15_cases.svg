<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 322" width="1360" height="644" role="img" aria-label="自建失败案例集：每次翻车存一条；每次改设置全部跑一遍，记修好几条和弄坏几条，弄坏的更重要；据此保留、再改或回滚"><rect width="680" height="322" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">每次翻车存一条，改完全部跑一遍</text><rect x="24" y="62" width="220" height="210" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="134" y="84" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937">我的失败案例集</text><text x="134" y="100" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">每次翻车存一条，一分钟</text><rect x="38" y="110" width="192" height="19" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><text x="48" y="123.5" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#1f2937">#003 把已完成的也列进待办</text><rect x="38" y="136" width="192" height="19" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><text x="48" y="149.5" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#1f2937">#007 文件名格式又变了</text><rect x="38" y="162" width="192" height="19" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><text x="48" y="175.5" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#1f2937">#012 删了 migrations 里的文件</text><rect x="38" y="188" width="192" height="19" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><text x="48" y="201.5" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#1f2937">#015 长日志读进来后开始糊涂</text><rect x="38" y="214" width="192" height="19" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><text x="48" y="227.5" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#6b7280">…… 三个月几十条</text><text x="134" y="256" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#6b7280">我说的 · 材料 · 错在哪 · 期望</text><line x1="250" y1="167" x2="284" y2="167" stroke="#2563eb" stroke-width="3" marker-end="url(#ab)"/><text x="267" y="156" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#2563eb">改完</text><rect x="290" y="62" width="180" height="210" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="380" y="84" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#2563eb">全部跑一遍，记两个数</text><rect x="304" y="100" width="152" height="60" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/><text x="380" y="124" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#15803d">以前错的，现在对了</text><text x="380" y="148" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="16" font-weight="700" fill="#15803d">3 条</text><rect x="304" y="170" width="152" height="60" rx="5" fill="#ffe4e6" stroke="#be123c" stroke-width="1.2"/><text x="380" y="194" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#be123c">以前对的，现在错了</text><text x="380" y="218" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="16" font-weight="700" fill="#be123c">2 条</text><text x="380" y="254" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#1f2937">第二个数字比第一个重要</text><rect x="516" y="62" width="140" height="210" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="586" y="84" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937">结论</text><rect x="530" y="104" width="112" height="30" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/><text x="586" y="124" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#15803d">保留</text><rect x="530" y="148" width="112" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="586" y="168" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#2563eb">改一改再测</text><rect x="530" y="192" width="112" height="30" rx="5" fill="#ffe4e6" stroke="#be123c" stroke-width="1.2"/><text x="586" y="212" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#be123c">回滚</text><text x="586" y="254" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">一次只改一样</text><text x="24" y="304" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">凭感觉判断，等于拿一次抽签的结果给整套设置打分。比较别打分；能精确判的精确判。</text></svg>