<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 322" width="680" height="322" role="img" aria-label="同一个单词 strawberry：人看到十个字母，模型看到 str、aw、berry 三个 token 块"><rect width="680" height="322" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">同一个单词，两种看法</text><text x="24" y="74" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#6b7280">你看见的</text><rect x="83" y="84" width="46" height="44" rx="7" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="106" y="112.3" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#1f2937">s</text><rect x="135" y="84" width="46" height="44" rx="7" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="158" y="112.3" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#1f2937">t</text><rect x="187" y="84" width="46" height="44" rx="7" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><text x="210" y="112.3" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#be123c">r</text><rect x="239" y="84" width="46" height="44" rx="7" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="262" y="112.3" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#1f2937">a</text><rect x="291" y="84" width="46" height="44" rx="7" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="314" y="112.3" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#1f2937">w</text><rect x="343" y="84" width="46" height="44" rx="7" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="366" y="112.3" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#1f2937">b</text><rect x="395" y="84" width="46" height="44" rx="7" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="418" y="112.3" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#1f2937">e</text><rect x="447" y="84" width="46" height="44" rx="7" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><text x="470" y="112.3" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#be123c">r</text><rect x="499" y="84" width="46" height="44" rx="7" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><text x="522" y="112.3" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#be123c">r</text><rect x="551" y="84" width="46" height="44" rx="7" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="574" y="112.3" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#1f2937">y</text><text x="340" y="156" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280">10 个字母，三个 r 一眼可见</text><text x="24" y="198" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#6b7280">它看见的</text><rect x="83" y="208" width="150" height="44" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="158" y="237" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#1f2937">str</text><rect x="239" y="208" width="98" height="44" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="288" y="237" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#1f2937">aw</text><rect x="343" y="208" width="254" height="44" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="470" y="237" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#1f2937">berry</text><line x1="236" y1="78" x2="236" y2="258" stroke="#be123c" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.75"/><line x1="340" y1="78" x2="340" y2="258" stroke="#be123c" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.75"/><text x="340" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280">3 个 token。第一个 r 藏在 str 里，另外两个藏在 berry 里</text><text x="340" y="304" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">虚线是切缝——它拿到的是整块，块里的字母并没有被单独标出来</text></svg>