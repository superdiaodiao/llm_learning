<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 306" width="1360" height="612" role="img" aria-label="一条记忆的一生：记之前先翻本子让模型判断，旧事变了可以覆盖改或追加新条链回旧条，两种都留账本"><rect width="680" height="306" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">你改主意了：改，还是追加</text><rect x="24" y="64" width="150" height="30" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.3"/><text x="99" y="84" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#1f2937">三月："我平时用 Python"</text><rect x="24" y="108" width="150" height="30" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/><text x="99" y="128" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#2563eb">六月："改用 Rust 了"</text><line x1="180" y1="123" x2="214" y2="123" stroke="#9ca3af" stroke-width="2" marker-end="url(#ah)"/><rect x="220" y="64" width="150" height="74" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="4 3"/><text x="295" y="86" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#1f2937">记之前先翻本子</text><text x="295" y="104" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">捞出旧条，跟新话放一起</text><text x="295" y="120" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">让模型判断：新事，还是旧事变了</text><line x1="376" y1="100" x2="410" y2="100" stroke="#be123c" stroke-width="2.5" marker-end="url(#ar)"/><line x1="376" y1="128" x2="410" y2="176" stroke="#be123c" stroke-width="2.5" marker-end="url(#ar)"/><text x="420" y="74" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#be123c">改（覆盖）</text><rect x="420" y="82" width="170" height="20" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="505" y="96" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#6b7280">平时用 Python</text><line x1="430" y1="92" x2="580" y2="92" stroke="#be123c" stroke-width="1.5"/><rect x="420" y="106" width="170" height="20" rx="3" fill="#ffe4e6" stroke="#be123c" stroke-width="1.2"/><text x="505" y="120" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#be123c">平时用 Rust</text><text x="600" y="120" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">只留一条</text><text x="420" y="160" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#be123c">追加（链回旧的）</text><rect x="420" y="168" width="170" height="20" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="505" y="182" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#1f2937">平时用 Python</text><rect x="420" y="194" width="170" height="20" rx="3" fill="#ffe4e6" stroke="#be123c" stroke-width="1.2"/><text x="505" y="208" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#be123c">从 Python 转到 Rust</text><path d="M 596 204 Q 612 190 596 178" fill="none" stroke="#be123c" stroke-width="1.5" marker-end="url(#ar)"/><text x="622" y="196" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">都留着</text><rect x="24" y="160" width="346" height="70" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3"/><text x="197" y="182" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#1f2937">两种都留账本</text><text x="197" y="200" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#6b7280">谁改了什么、什么时候改的，能追回去</text><text x="197" y="218" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#6b7280">删也是软删，先划掉，不真丢</text><text x="24" y="266" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">记串：旧条没删干净，两条打架，捞出来时哪条排前面就信哪条。</text><text x="24" y="286" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">记错：抽取那步曲解了原意，本子上从一开始就是错的；之后每次都捞出这条，越用越像真的。</text></svg>