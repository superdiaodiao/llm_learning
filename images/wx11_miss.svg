<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 322" width="1360" height="644" role="img" aria-label="答错的三种原因：答案被切成两半、问法和文档说法差太远没捞到、捞到了但塞在窗口中间没看见"><rect width="680" height="322" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">答错，多半是没捞到</text><rect x="24" y="60" width="204" height="210" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="126" y="84" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#be123c">切坏了</text><rect x="54" y="104" width="144" height="44" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.3"/><rect x="54" y="160" width="144" height="44" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.3"/><rect x="68" y="130" width="116" height="10" rx="2" fill="#ffe4e6" stroke="#be123c" stroke-width="1"/><rect x="68" y="168" width="116" height="10" rx="2" fill="#ffe4e6" stroke="#be123c" stroke-width="1"/><line x1="44" y1="154" x2="208" y2="154" stroke="#be123c" stroke-width="2" stroke-dasharray="4 3"/><text x="126" y="118" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">第三年起，违约金按……</text><text x="126" y="196" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">……未付金额的 5% 计。</text><text x="126" y="244" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#1f2937">答案横跨两张卡片</text><text x="126" y="260" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#6b7280">哪张都不完整</text><rect x="238" y="60" width="204" height="210" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="340" y="84" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#be123c">捞偏了</text><rect x="268" y="104" width="144" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/><text x="340" y="121" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#2563eb">问：违约了要赔多少</text><rect x="268" y="150" width="144" height="26" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.3"/><text x="340" y="167" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#6b7280">文：逾期赔偿 · 滞纳金</text><line x1="340" y1="132" x2="340" y2="148" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3 3"/><text x="340" y="196" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#6b7280">两串数字离得远</text><text x="340" y="244" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#1f2937">你的说法和文档差太远</text><text x="340" y="260" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#6b7280">最近的几串里没有它</text><rect x="452" y="60" width="204" height="210" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="554" y="84" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#be123c">捞到了，没看见</text><rect x="482" y="104" width="144" height="100" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3"/><rect x="494" y="112" width="120" height="12" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><rect x="494" y="130" width="120" height="12" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><rect x="494" y="148" width="120" height="12" rx="2" fill="#ffe4e6" stroke="#be123c" stroke-width="1"/><rect x="494" y="166" width="120" height="12" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><rect x="494" y="184" width="120" height="12" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/><text x="554" y="220" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">开头结尾记得牢，中间容易丢</text><text x="554" y="244" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#1f2937">塞在窗口中间</text><text x="554" y="260" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#6b7280">第 5 课讲过</text><text x="24" y="302" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">三种错都出在模型之外。换一个更聪明的模型，一张没捞到的卡片还是没捞到。</text></svg>