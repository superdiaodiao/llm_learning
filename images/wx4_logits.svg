<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="1360" height="660" role="img" aria-label="最后一个向量被投成词表长度的分数，再压成加起来 100% 的概率表"><rect width="680" height="330" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">模型的输出不是一个词，是一张表</text><text x="28" y="76" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">输入</text><rect x="28" y="86" width="200" height="42" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="128" y="112.4" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="15" font-weight="400" fill="#1f2937">The cat sat on the</text><text x="128" y="156" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">↓ 第 3 课加工过的向量</text><rect x="28" y="166" width="200" height="36" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="128" y="188.68" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="13" font-weight="600" fill="#2563eb">0.21  −0.88  0.34  …</text><line x1="240" y1="150" x2="284" y2="150" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/><text x="262" y="138" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">投影</text><text x="300" y="76" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">下一个词的概率表（十几万行，只画前几行）</text><text x="352" y="106" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#1f2937">mat</text><rect x="360" y="88" width="161.2" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="531.2" y="106" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="13" font-weight="400" fill="#6b7280">62%</text><text x="352" y="144" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#1f2937">floor</text><rect x="360" y="126" width="52" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="422" y="144" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="13" font-weight="400" fill="#6b7280">20%</text><text x="352" y="182" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#1f2937">chair</text><rect x="360" y="164" width="23.4" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="393.4" y="182" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="13" font-weight="400" fill="#6b7280">9%</text><text x="352" y="220" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#1f2937">其他</text><rect x="360" y="202" width="23.4" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="393.4" y="220" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="13" font-weight="400" fill="#6b7280">9%</text><text x="24" y="306" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2937">加起来正好 100%。模型到此为止——挑哪个词，是另一段程序的事。</text></svg>