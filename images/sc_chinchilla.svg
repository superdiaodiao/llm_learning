<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="1360" height="680" role="img" aria-label="同样训练算力下 Chinchilla 70B 用四倍数据全面超过 Gopher 280B；之后行业转向小模型过度训练，Llama 3 8B 约 1900 token 每参数"><rect width="680" height="340" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">同样的训练算力：买"大"还是买"多"</text><text x="24" y="76" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937">Gopher（2021）</text><text x="24" y="94" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">参数</text><rect x="70" y="82" width="280" height="18" rx="4" fill="#ffe4e6" stroke="#be123c" stroke-width="1.3"/><text x="210" y="95" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#be123c">280B</text><text x="24" y="120" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">token</text><rect x="70" y="108" width="60" height="18" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3"/><text x="100" y="121" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#6b7280">300B</text><text x="140" y="121" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#6b7280">≈ 1 token / 参数</text><text x="24" y="160" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937">Chinchilla（2022）</text><text x="24" y="178" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">参数</text><rect x="70" y="166" width="70" height="18" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3"/><text x="105" y="179" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#6b7280">70B</text><text x="24" y="204" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">token</text><rect x="70" y="192" width="280" height="18" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/><text x="210" y="205" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#15803d">1.4T</text><text x="150" y="179" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#6b7280">≈ 20 token / 参数</text><rect x="380" y="70" width="276" height="150" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="518" y="92" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937">训练算力相同</text><rect x="392" y="112" width="252" height="18" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="518" y="125" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.2" font-weight="400" fill="#1f2937">参数只有四分之一，数据多四倍多</text><rect x="392" y="136" width="252" height="18" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="518" y="149" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.2" font-weight="400" fill="#1f2937">几乎所有基准全面超过 Gopher</text><rect x="392" y="160" width="252" height="18" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="518" y="173" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.2" font-weight="400" fill="#1f2937">推理便宜四倍：每个 token 搬的参数少</text><rect x="392" y="184" width="252" height="18" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1"/><text x="518" y="197" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.2" font-weight="600" fill="#15803d">结论：固定预算下，参数和数据等比例长</text><text x="24" y="250" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#1f2937">Chinchilla 之后：把推理成本算进总账，最优点往"更小、更多"偏</text><text x="24" y="275" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1f2937">Chinchilla 70B</text><rect x="130" y="262" width="43.1579" height="16" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="183.158" y="274" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#6b7280">1.4T token，约 20 token / 参数</text><text x="24" y="297" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1f2937">LLaMA 1 7B</text><rect x="130" y="284" width="62.1053" height="16" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="202.105" y="296" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#1f2937">1T token，约 140 token / 参数</text><text x="24" y="319" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1f2937">Llama 3 8B</text><rect x="130" y="306" width="340" height="16" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="480" y="318" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="600" fill="#2563eb">15T+ token，约 1900 token / 参数</text></svg>