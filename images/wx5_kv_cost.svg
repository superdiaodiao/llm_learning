<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="1360" height="680" role="img" aria-label="每个词留下一张名片，新词要翻所有名片，所以越长越慢越贵"><rect width="680" height="340" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">为什么窗口不能无限大</text><text x="24" y="76" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">已经出现的词</text><rect x="40" y="84" width="54" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="67" y="109.04" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#1f2937">我</text><rect x="106" y="84" width="54" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="133" y="109.04" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#1f2937">去</text><rect x="172" y="84" width="68" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="206" y="109.04" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#1f2937">河边</text><rect x="252" y="84" width="54" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="279" y="109.04" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#1f2937">的</text><rect x="318" y="84" width="96" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="366" y="109.04" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="14" font-weight="400" fill="#1f2937">bank</text><rect x="426" y="84" width="68" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="460" y="109.04" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#1f2937">散步</text><rect x="506" y="84" width="92" height="40" rx="6" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><text x="552" y="109.04" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#be123c">新词</text><text x="24" y="170" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">每个词留下的"名片"</text><rect x="45" y="180" width="44" height="30" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/><line x1="53" y1="190" x2="81" y2="190" stroke="#2563eb" stroke-width="1.5" opacity="0.6"/><line x1="53" y1="198" x2="73" y2="198" stroke="#2563eb" stroke-width="1.5" opacity="0.35"/><path d="M552 128 Q 309.5 160 67 178" stroke="#be123c" stroke-width="1.3" fill="none" opacity="0.55" marker-end="url(#ar)"/><rect x="111" y="180" width="44" height="30" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/><line x1="119" y1="190" x2="147" y2="190" stroke="#2563eb" stroke-width="1.5" opacity="0.6"/><line x1="119" y1="198" x2="139" y2="198" stroke="#2563eb" stroke-width="1.5" opacity="0.35"/><path d="M552 128 Q 342.5 160 133 178" stroke="#be123c" stroke-width="1.3" fill="none" opacity="0.55" marker-end="url(#ar)"/><rect x="184" y="180" width="44" height="30" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/><line x1="192" y1="190" x2="220" y2="190" stroke="#2563eb" stroke-width="1.5" opacity="0.6"/><line x1="192" y1="198" x2="212" y2="198" stroke="#2563eb" stroke-width="1.5" opacity="0.35"/><path d="M552 128 Q 379 160 206 178" stroke="#be123c" stroke-width="1.3" fill="none" opacity="0.55" marker-end="url(#ar)"/><rect x="257" y="180" width="44" height="30" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/><line x1="265" y1="190" x2="293" y2="190" stroke="#2563eb" stroke-width="1.5" opacity="0.6"/><line x1="265" y1="198" x2="285" y2="198" stroke="#2563eb" stroke-width="1.5" opacity="0.35"/><path d="M552 128 Q 415.5 160 279 178" stroke="#be123c" stroke-width="1.3" fill="none" opacity="0.55" marker-end="url(#ar)"/><rect x="344" y="180" width="44" height="30" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/><line x1="352" y1="190" x2="380" y2="190" stroke="#2563eb" stroke-width="1.5" opacity="0.6"/><line x1="352" y1="198" x2="372" y2="198" stroke="#2563eb" stroke-width="1.5" opacity="0.35"/><path d="M552 128 Q 459 160 366 178" stroke="#be123c" stroke-width="1.3" fill="none" opacity="0.55" marker-end="url(#ar)"/><rect x="438" y="180" width="44" height="30" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/><line x1="446" y1="190" x2="474" y2="190" stroke="#2563eb" stroke-width="1.5" opacity="0.6"/><line x1="446" y1="198" x2="466" y2="198" stroke="#2563eb" stroke-width="1.5" opacity="0.35"/><path d="M552 128 Q 506 160 460 178" stroke="#be123c" stroke-width="1.3" fill="none" opacity="0.55" marker-end="url(#ar)"/><text x="560" y="152" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="600" fill="#be123c">要翻遍每一张</text><line x1="24" y1="236" x2="656" y2="236" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><text x="24" y="264" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#1f2937">第 7 个词翻 6 张；第 10000 个词翻 9999 张。</text><text x="24" y="288" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2937">名片越多，占的内存越大、翻得越慢——这就是"长上下文"要花钱的原因。</text><text x="24" y="316" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">（这堆名片在工程上叫 KV cache。）</text></svg>