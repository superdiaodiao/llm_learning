<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="1360" height="680" role="img" aria-label="训练只做一道题：给一段文字，猜下一个词；答案就在原文里"><rect width="680" height="340" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">训练只做一道题：猜下一个词</text><rect x="40" y="84" width="60" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="70" y="109.04" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#1f2937">今天</text><rect x="110" y="84" width="60" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="140" y="109.04" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#1f2937">天气</text><rect x="180" y="84" width="40" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="200" y="109.04" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#1f2937">很</text><rect x="230" y="84" width="60" height="40" rx="6" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="260" y="109.76" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#be123c">？</text><text x="24" y="76" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">遮住一个词</text><text x="330" y="76" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">模型的猜测</text><text x="352" y="100" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#be123c">好</text><rect x="364" y="89" width="63" height="14" rx="3" fill="#be123c"/><text x="433" y="100" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#be123c">42%</text><text x="352" y="124" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#1f2937">冷</text><rect x="364" y="113" width="31.5" height="14" rx="3" fill="#cbd5e1"/><text x="401.5" y="124" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280">21%</text><text x="352" y="148" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#1f2937">热</text><rect x="364" y="137" width="22.5" height="14" rx="3" fill="#cbd5e1"/><text x="392.5" y="148" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280">15%</text><text x="352" y="172" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#1f2937">差</text><rect x="364" y="161" width="12" height="14" rx="3" fill="#cbd5e1"/><text x="382" y="172" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280">8%</text><text x="352" y="196" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#1f2937">……</text><rect x="364" y="185" width="21" height="14" rx="3" fill="#cbd5e1"/><text x="391" y="196" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280">14%</text><line x1="530" y1="140" x2="568" y2="140" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/><text x="549" y="128" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280">揭开</text><rect x="578" y="120" width="70" height="40" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><text x="613" y="145.76" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1f2937">好</text><text x="613" y="76" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">原文里的答案</text><text x="613" y="182" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#be123c">给了 42%，有点惊讶</text><line x1="24" y1="212" x2="656" y2="212" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><text x="24" y="244" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2937">答案不用人写，就在原文里。一个句子 = 一道题 + 一份标准答案。</text><text x="24" y="272" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#1f2937">网页、书、代码、百科……互联网上有几万亿道这样的题。</text><text x="24" y="316" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">（"惊讶程度"工程上叫 loss：真实答案的概率越低，loss 越高。）</text></svg>