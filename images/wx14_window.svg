<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 344" width="1360" height="688" role="img" aria-label="同一个窗口的两种装法：规则放开头当前任务放结尾、工具结果压成几行、留有余地；对比什么都往里倒把关键的淹没"><rect width="680" height="344" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">同一个窗口，装法不同</text><rect x="60" y="76" width="200" height="200" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.6"/><text x="160" y="66" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#15803d">装得好</text><rect x="68" y="84" width="184" height="22" rx="3" fill="#ffe4e6" stroke="#be123c" stroke-width="1.1"/><text x="160" y="99" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#be123c">规则（放开头）</text><rect x="68" y="110" width="184" height="16" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.1"/><text x="160" y="122" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#1f2937">工具表</text><rect x="68" y="130" width="184" height="24" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/><text x="160" y="146" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#2563eb">捞出来的 3 张卡片</text><rect x="68" y="158" width="184" height="16" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.1"/><text x="160" y="170" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#1f2937">早期历史 → 一段摘要</text><rect x="68" y="178" width="184" height="20" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.1"/><text x="160" y="192" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#1f2937">搜索结果 → 压成 5 行</text><rect x="68" y="202" width="184" height="40" rx="3" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.1"/><text x="160" y="226" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">留白</text><rect x="68" y="246" width="184" height="22" rx="3" fill="#ffe4e6" stroke="#be123c" stroke-width="1.1"/><text x="160" y="261" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#be123c">当前任务（放结尾）</text><text x="160" y="296" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#6b7280">关键的都看得见，还有余地</text><rect x="420" y="76" width="200" height="200" rx="8" fill="#ffffff" stroke="#be123c" stroke-width="1.6"/><text x="520" y="66" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#be123c">什么都往里倒</text><rect x="428" y="84" width="184" height="14" rx="3" fill="#ffe4e6" stroke="#be123c" stroke-width="1.1"/><text x="520" y="95" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#be123c">规则</text><rect x="428" y="102" width="184" height="62" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.1"/><text x="520" y="137" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">搜索结果原文 3000 行</text><rect x="428" y="168" width="184" height="44" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.1"/><text x="520" y="194" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">日志原文</text><rect x="428" y="216" width="184" height="34" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.1"/><text x="520" y="237" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">全部聊天历史</text><rect x="428" y="254" width="184" height="14" rx="3" fill="#ffe4e6" stroke="#be123c" stroke-width="1.1"/><text x="520" y="265" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#be123c">当前任务</text><text x="520" y="296" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#6b7280">窗口撑爆，关键的被淹了</text><text x="340" y="180" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#6b7280">同一个</text><text x="340" y="198" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#6b7280">发动机</text><text x="24" y="326" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">窗口里放什么，是程序每一轮临时拼的。最大的敌人是工具返回的东西：先裁剪再放，原文留在外面。</text></svg>