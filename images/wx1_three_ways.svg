<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 416" width="680" height="416" role="img" aria-label="三种切法对比：按字母切、按整词切都不行，按碎片切是现在的做法"><rect width="680" height="416" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">为什么切成"碎片"，而不是字母或整词</text><rect x="24" y="56" width="632" height="100" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="44" y="88" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14.5" font-weight="600" fill="#1f2937">✗ 按字母切</text><text x="44" y="114" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">序列长到吓人，单个</text><text x="44" y="132" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">字母几乎不带意思</text><rect x="24" y="168" width="632" height="100" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="44" y="200" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14.5" font-weight="600" fill="#1f2937">✗ 按整词切</text><text x="44" y="226" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">词表爆炸，遇到没见过</text><text x="44" y="244" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">的词直接失明</text><rect x="24" y="280" width="632" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="44" y="312" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14.5" font-weight="600" fill="#2563eb">✓ 按碎片切</text><text x="44" y="338" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">词表可控，任何词都</text><text x="44" y="356" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">拼得出来</text><rect x="268" y="88" width="26" height="36" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="281" y="110.9" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937">t</text><rect x="298" y="88" width="26" height="36" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="311" y="110.9" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937">o</text><rect x="328" y="88" width="26" height="36" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="341" y="110.9" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937">k</text><rect x="358" y="88" width="26" height="36" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="371" y="110.9" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937">e</text><rect x="388" y="88" width="26" height="36" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="401" y="110.9" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937">n</text><rect x="418" y="88" width="26" height="36" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="431" y="110.9" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937">i</text><rect x="448" y="88" width="26" height="36" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="461" y="110.9" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937">z</text><rect x="478" y="88" width="26" height="36" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="491" y="110.9" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937">a</text><rect x="508" y="88" width="26" height="36" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="521" y="110.9" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937">t</text><rect x="538" y="88" width="26" height="36" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="551" y="110.9" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937">i</text><rect x="568" y="88" width="26" height="36" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="581" y="110.9" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937">o</text><rect x="598" y="88" width="26" height="36" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="611" y="110.9" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#1f2937">n</text><rect x="268" y="200" width="200" height="36" rx="7" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="368" y="223.25" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#1f2937">tokenization</text><rect x="486" y="200" width="100" height="36" rx="7" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><text x="536" y="223.25" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#be123c">???</text><text x="536" y="258" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#be123c">词表里没有 → 失明</text><rect x="268" y="312" width="140" height="36" rx="7" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="338" y="335.25" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#1f2937">token</text><rect x="414" y="312" width="170" height="36" rx="7" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="499" y="335.25" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#1f2937">ization</text><line x1="411" y1="306" x2="411" y2="354" stroke="#be123c" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.75"/></svg>