<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="1360" height="1120">
<rect width="680" height="560" fill="#ffffff"/>
<text x="20" y="22" font-family="Noto Sans CJK SC" font-size="13" fill="#1f2937" text-anchor="start" font-weight="600">主管拓扑（最常用）：一个主管派活，专精子 agent 各干各的</text>
<rect x="270" y="40" width="140" height="52" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8"/>
<text x="340" y="61" font-family="Noto Sans CJK SC" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600">主管 Supervisor</text>
<text x="340" y="79" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="middle">路由 + 整合</text>
<line x1="300" y1="92" x2="150" y2="130" stroke="#9ca3af" stroke-width="1.6"/>
<polygon points="150,130 158.7,131.9 156.8,124.2" fill="#9ca3af"/>
<line x1="340" y1="92" x2="340" y2="130" stroke="#9ca3af" stroke-width="1.6"/>
<polygon points="340,130 344.0,122.0 336.0,122.0" fill="#9ca3af"/>
<line x1="380" y1="92" x2="530" y2="130" stroke="#9ca3af" stroke-width="1.6"/>
<polygon points="530,130 523.2,124.2 521.3,131.9" fill="#9ca3af"/>
<text x="200" y="112" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="start">派任务</text>
<rect x="60" y="132" width="180" height="96" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4,3"/>
<rect x="76" y="142" width="148" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="150" y="160" font-family="Noto Sans CJK SC" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="600">研究员 agent</text>
<text x="150" y="176" font-family="Noto Sans CJK SC" font-size="9.5" fill="#4b5563" text-anchor="middle">工具: search, fetch</text>
<text x="150" y="204" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="middle">独立上下文窗口</text>
<text x="150" y="220" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="middle">（内部细节不外流）</text>
<rect x="250" y="132" width="180" height="96" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4,3"/>
<rect x="266" y="142" width="148" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="340" y="160" font-family="Noto Sans CJK SC" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="600">程序员 agent</text>
<text x="340" y="176" font-family="Noto Sans CJK SC" font-size="9.5" fill="#4b5563" text-anchor="middle">工具: run_code, tests</text>
<text x="340" y="204" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="middle">独立上下文窗口</text>
<text x="340" y="220" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="middle">（内部细节不外流）</text>
<rect x="440" y="132" width="180" height="96" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4,3"/>
<rect x="456" y="142" width="148" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="530" y="160" font-family="Noto Sans CJK SC" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="600">审稿 agent</text>
<text x="530" y="176" font-family="Noto Sans CJK SC" font-size="9.5" fill="#4b5563" text-anchor="middle">工具: lint, checklist</text>
<text x="530" y="204" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="middle">独立上下文窗口</text>
<text x="530" y="220" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="middle">（内部细节不外流）</text>
<line x1="150" y1="228" x2="300" y2="262" stroke="#2563eb" stroke-width="1.6"/>
<polygon points="300,262 293.1,256.3 291.3,264.1" fill="#2563eb"/>
<line x1="340" y1="228" x2="340" y2="262" stroke="#2563eb" stroke-width="1.6"/>
<polygon points="340,262 344.0,254.0 336.0,254.0" fill="#2563eb"/>
<line x1="530" y1="228" x2="380" y2="262" stroke="#2563eb" stroke-width="1.6"/>
<polygon points="380,262 388.7,264.1 386.9,256.3" fill="#2563eb"/>
<text x="430" y="250" font-family="Noto Sans CJK SC" font-size="10" fill="#2563eb" text-anchor="start" font-weight="600">只回传“摘要”</text>
<rect x="270" y="264" width="140" height="36" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8"/>
<text x="340" y="286" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="middle">主管整合 → 答案</text>
<rect x="20" y="316" width="640" height="46" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="34" y="336" font-family="Noto Sans CJK SC" font-size="11" fill="#2563eb" text-anchor="start" font-weight="600">要害：多 agent 的本质是“上下文隔离 + 专精”，不是“agent 越多越聪明”。</text>
<text x="34" y="354" font-family="Noto Sans CJK SC" font-size="10.5" fill="#4b5563" text-anchor="start">主管的上下文永远干净（只见摘要）；每个子 agent 拿着窄任务 + 少量专属工具，选工具更准、更少跑偏。</text>
<text x="20" y="392" font-family="Noto Sans CJK SC" font-size="13" fill="#1f2937" text-anchor="start" font-weight="600">另外三种拓扑</text>
<rect x="20" y="404" width="205" height="140" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="34" y="426" font-family="Noto Sans CJK SC" font-size="12" fill="#1f2937" text-anchor="start" font-weight="600">流水线 Pipeline</text>
<text x="34" y="448" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="start">研究 → 写作 → 校对</text>
<text x="34" y="470" font-family="Noto Sans CJK SC" font-size="10.5" fill="#4b5563" text-anchor="start">固定顺序依次交接，</text>
<text x="34" y="486" font-family="Noto Sans CJK SC" font-size="10.5" fill="#4b5563" text-anchor="start">每站只管自己那段。</text>
<text x="34" y="502" font-family="Noto Sans CJK SC" font-size="10.5" fill="#4b5563" text-anchor="start">适合：步骤明确、</text>
<text x="34" y="518" font-family="Noto Sans CJK SC" font-size="10.5" fill="#4b5563" text-anchor="start">产出可分阶段的任务。</text>
<rect x="237" y="404" width="205" height="140" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="251" y="426" font-family="Noto Sans CJK SC" font-size="12" fill="#1f2937" text-anchor="start" font-weight="600">网络 / 交接 Network</text>
<text x="251" y="448" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="start">A ⇄ B ⇄ C（动态交接）</text>
<text x="251" y="470" font-family="Noto Sans CJK SC" font-size="10.5" fill="#4b5563" text-anchor="start">对等 agent 互相把控制权</text>
<text x="251" y="486" font-family="Noto Sans CJK SC" font-size="10.5" fill="#4b5563" text-anchor="start">“交接”出去，无固定主管。</text>
<text x="251" y="502" font-family="Noto Sans CJK SC" font-size="10.5" fill="#4b5563" text-anchor="start">灵活但难控、难调试，</text>
<text x="251" y="518" font-family="Noto Sans CJK SC" font-size="10.5" fill="#4b5563" text-anchor="start">容易互相踢皮球。</text>
<rect x="454" y="404" width="206" height="140" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="468" y="426" font-family="Noto Sans CJK SC" font-size="12" fill="#1f2937" text-anchor="start" font-weight="600">辩论 / 集成 Debate</text>
<text x="468" y="448" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="start">多份独立解 → 互评/投票</text>
<text x="468" y="470" font-family="Noto Sans CJK SC" font-size="10.5" fill="#4b5563" text-anchor="start">多个 agent 各自独立解题，</text>
<text x="468" y="486" font-family="Noto Sans CJK SC" font-size="10.5" fill="#4b5563" text-anchor="start">再互相批评或投票合并。</text>
<text x="468" y="502" font-family="Noto Sans CJK SC" font-size="10.5" fill="#4b5563" text-anchor="start">用冗余换可靠性，</text>
<text x="468" y="518" font-family="Noto Sans CJK SC" font-size="10.5" fill="#4b5563" text-anchor="start">成本随份数倍增。</text>
</svg>
