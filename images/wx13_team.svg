<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 344" width="1360" height="688" role="img" aria-label="多个 Agent 的主管拓扑：主管只派活收结论，每个下属有自己的工具表和窗口，过程细节不流进主管窗口"><rect width="680" height="344" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">一个干不过来，就拆：交上去的只有结论</text><rect x="250" y="62" width="180" height="60" rx="8" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><text x="340" y="86" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="700" fill="#be123c">主管</text><text x="340" y="104" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#1f2937">只管派活、收结论</text><text x="340" y="116" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">窗口里只有几段摘要</text><rect x="24" y="160" width="180" height="120" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="114" y="182" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937">查资料</text><text x="114" y="196" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#6b7280">自己的工具表、自己的窗口</text><rect x="38" y="206" width="152" height="17" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.1"/><text x="114" y="218.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">翻了 40 页文档</text><rect x="38" y="228" width="152" height="17" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.1"/><text x="114" y="240.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">捞了 6 张卡片</text><rect x="38" y="250" width="152" height="17" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/><text x="114" y="262.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#2563eb">→ 结论：第 3 年 5%</text><line x1="106" y1="156" x2="275.5" y2="126" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><line x1="291.5" y1="126" x2="122" y2="156" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/><rect x="250" y="160" width="180" height="120" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="340" y="182" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937">跑代码</text><text x="340" y="196" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#6b7280">自己的工具表、自己的窗口</text><rect x="264" y="206" width="152" height="17" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.1"/><text x="340" y="218.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">改了 3 个文件</text><rect x="264" y="228" width="152" height="17" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.1"/><text x="340" y="240.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">跑了 20 次测试</text><rect x="264" y="250" width="152" height="17" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/><text x="340" y="262.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#2563eb">→ 结论：通过</text><line x1="332" y1="156" x2="332" y2="126" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><line x1="348" y1="126" x2="348" y2="156" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/><rect x="476" y="160" width="180" height="120" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="566" y="182" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937">发通知</text><text x="566" y="196" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#6b7280">自己的工具表、自己的窗口</text><rect x="490" y="206" width="152" height="17" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.1"/><text x="566" y="218.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">查了收件人</text><rect x="490" y="228" width="152" height="17" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.1"/><text x="566" y="240.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">写了两版草稿</text><rect x="490" y="250" width="152" height="17" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/><text x="566" y="262.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#2563eb">→ 结论：已发</text><line x1="558" y1="156" x2="388.5" y2="126" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><line x1="404.5" y1="126" x2="574" y2="156" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/><text x="24" y="306" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">派下去的是任务，交上来的只有一段结论。下属翻过的资料、跑过的测试，留在它自己的窗口里，不进主管的。</text><text x="24" y="326" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">拆是为了隔离，不是人多力量大。结论会丢细节、下属错了主管照单全收。一个能干好的，就别拆。</text></svg>