<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 328" width="1360" height="656" role="img" aria-label="Scaling law：损失随参数量、数据量、训练算力在对数坐标下呈直线下降；三者要一起长"><rect width="680" height="328" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Scaling law：损失随参数、数据、算力按幂律下降（对数坐标）</text><line x1="54" y1="220" x2="54" y2="80" stroke="#9ca3af" stroke-width="1.2"/><line x1="54" y1="220" x2="224" y2="220" stroke="#9ca3af" stroke-width="1.2"/><text x="139" y="236" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">参数量 N</text><text x="48" y="74" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">损失</text><line x1="60" y1="96" x2="218" y2="200" stroke="#be123c" stroke-width="2"/><circle cx="64" cy="97" r="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><circle cx="89" cy="119" r="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><circle cx="114" cy="129" r="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><circle cx="139" cy="151" r="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><circle cx="164" cy="161" r="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><circle cx="189" cy="183" r="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><circle cx="214" cy="193" r="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><text x="139" y="250" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">10⁵ → 10⁹</text><line x1="268" y1="220" x2="268" y2="80" stroke="#9ca3af" stroke-width="1.2"/><line x1="268" y1="220" x2="438" y2="220" stroke="#9ca3af" stroke-width="1.2"/><text x="353" y="236" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">数据量 D</text><text x="262" y="74" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">损失</text><line x1="274" y1="96" x2="432" y2="200" stroke="#be123c" stroke-width="2"/><circle cx="278" cy="97" r="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><circle cx="303" cy="119" r="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><circle cx="328" cy="129" r="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><circle cx="353" cy="151" r="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><circle cx="378" cy="161" r="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><circle cx="403" cy="183" r="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><circle cx="428" cy="193" r="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><text x="353" y="250" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">10⁷ → 10¹⁰ token</text><line x1="482" y1="220" x2="482" y2="80" stroke="#9ca3af" stroke-width="1.2"/><line x1="482" y1="220" x2="652" y2="220" stroke="#9ca3af" stroke-width="1.2"/><text x="567" y="236" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">训练算力 C</text><text x="476" y="74" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">损失</text><line x1="488" y1="96" x2="646" y2="200" stroke="#be123c" stroke-width="2"/><circle cx="492" cy="97" r="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><circle cx="517" cy="119" r="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><circle cx="542" cy="129" r="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><circle cx="567" cy="151" r="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><circle cx="592" cy="161" r="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><circle cx="617" cy="183" r="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><circle cx="642" cy="193" r="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><text x="567" y="250" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">跨 7 个数量级</text><path d="M 548 135 Q 602 150 652 152" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/><text x="612" y="142" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#6b7280">数据不够时线会弯</text><text x="24" y="290" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">三条线跨七个数量级都是直线：投入翻十倍，损失稳定降一小截，可以提前预测。前提是三个量都不成为瓶颈。</text><text x="24" y="310" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">它描述的是损失，不是某项能力。损失平滑下降，某些任务的准确率却可能在某个规模突然起来（涌现，部分是度量造成的）。</text></svg>