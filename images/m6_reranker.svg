<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="1360" height="940">
<rect width="680" height="470" fill="#ffffff"/>
<text x="20" y="24" font-family="Noto Sans CJK SC" font-size="13" fill="#1f2937" text-anchor="start" font-weight="600">两种“算相关度”的方式</text>
<rect x="20" y="36" width="300" height="150" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="34" y="58" font-family="Noto Sans CJK SC" font-size="12" fill="#1f2937" text-anchor="start" font-weight="600">① 双编码器 bi-encoder（检索用）</text>
<text x="34" y="82" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">query → [模型] → 向量A</text>
<text x="34" y="102" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">doc   → [模型] → 向量B</text>
<text x="34" y="122" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">相关度 = A 与 B 的夹角</text>
<text x="34" y="150" font-family="Noto Sans CJK SC" font-size="11" fill="#2563eb" text-anchor="start" font-weight="600">✓ 快：doc 向量可预先算好、批量比</text>
<text x="34" y="170" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">✗ 粗：query 和 doc 从没“见过面”</text>
<rect x="340" y="36" width="320" height="150" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="354" y="58" font-family="Noto Sans CJK SC" font-size="12" fill="#1f2937" text-anchor="start" font-weight="600">② 交叉编码器 cross-encoder（重排用）</text>
<text x="354" y="82" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">[query + doc] 拼一起 → [模型] → 一个分数</text>
<text x="354" y="112" font-family="Noto Sans CJK SC" font-size="11" fill="#2563eb" text-anchor="start" font-weight="600">✓ 准：query 和 doc 在同一次 attention 里</text>
<text x="354" y="130" font-family="Noto Sans CJK SC" font-size="11" fill="#2563eb" text-anchor="start" font-weight="600">    互相“看”→ 判断精细得多</text>
<text x="354" y="158" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">✗ 慢：没法预算，每个 (query,doc) 对都要</text>
<text x="354" y="176" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">    现场跑一遍模型</text>
<text x="20" y="222" font-family="Noto Sans CJK SC" font-size="13" fill="#1f2937" text-anchor="start" font-weight="600">RAG 的解法：漏斗，两阶段各取所长</text>
<rect x="60" y="240" width="180" height="46" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="150" y="260" font-family="Noto Sans CJK SC" font-size="12" fill="#4b5563" text-anchor="middle">百万级文档块</text>
<text x="150" y="278" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="middle">全部库存</text>
<line x1="240" y1="263" x2="286" y2="263" stroke="#9ca3af" stroke-width="1.6"/>
<polygon points="286,263 278.0,259.0 278.0,267.0" fill="#9ca3af"/>
<text x="263" y="253" font-family="Noto Sans CJK SC" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="600">① 粗筛</text>
<text x="263" y="300" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="middle">embedding + 近邻搜索</text>
<rect x="288" y="240" width="150" height="46" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="363" y="260" font-family="Noto Sans CJK SC" font-size="12" fill="#4b5563" text-anchor="middle">top 50~100</text>
<text x="363" y="278" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="middle">候选</text>
<line x1="438" y1="263" x2="484" y2="263" stroke="#9ca3af" stroke-width="1.6"/>
<polygon points="484,263 476.0,259.0 476.0,267.0" fill="#9ca3af"/>
<text x="461" y="253" font-family="Noto Sans CJK SC" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="600">② 精排</text>
<text x="461" y="300" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="middle">reranker 逐个打分</text>
<rect x="486" y="240" width="150" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="561" y="260" font-family="Noto Sans CJK SC" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="600">top 3~5</text>
<text x="561" y="278" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="middle">拼进提示词</text>
<rect x="20" y="330" width="640" height="124" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="34" y="354" font-family="Noto Sans CJK SC" font-size="13" fill="#1f2937" text-anchor="start" font-weight="600">为什么非要两阶段？</text>
<text x="34" y="378" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">· 交叉编码器最准，但对百万文档逐个跑，慢到没法用。</text>
<text x="34" y="400" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">· 双编码器快，能秒筛百万，但会漏掉一些“向量看着不近、其实很相关”的块。</text>
<text x="34" y="422" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">· 漏斗：先用快的把百万砍到上百（保证不漏太多），再用准的在上百里精挑（保证排得对）。</text>
<text x="34" y="444" font-family="Noto Sans CJK SC" font-size="10.5" fill="#2563eb" text-anchor="start" font-weight="600">LlamaIndex 里它叫 node postprocessor（如 SentenceTransformerRerank、Cohere rerank）。</text>
</svg>
