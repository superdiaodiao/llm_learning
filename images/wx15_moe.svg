"#ffe4e6" stroke="#be123c" stroke-width="1.3"/><text x="526" y="168" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="600" fill="#be123c">专家</text><text x="526" y="184" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="9.5" font-weight="700" fill="#be123c">6</text><line x1="452" y1="132" x2="526" y2="148" stroke="#be123c" stroke-width="2" marker-end="url(#ar)"/><rect x="554" y="150" width="40" height="44" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="574" y="168" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#6b7280">专家</text><text x="574" y="184" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="9.5" font-weight="400" fill="#6b7280">7</text><text x="574" y="206" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="8" font-weight="400" fill="#6b7280">歇着</text><rect x="602" y="150" width="40" height="44" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="622" y="168" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#6b7280">专家</text><text x="622" y="184" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="9.5" font-weight="400" fill="#6b7280">8</text><text x="622" y="206" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="8" font-weight="400" fill="#6b7280">歇着</text><text x="452" y="230" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#1f2937">总参数 470 亿，每个词只动用 130 亿；能力接近 700 亿的普通模型</text><text x="452" y="246" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#2563eb">看到"万亿参数"，先问：每个词实际用多少</text><text x="24" y="292" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">省的是算，不是搬：八个专家都得在显卡内存里，因为下一个词可能选任何一个（第 10 课）。</text></svg>