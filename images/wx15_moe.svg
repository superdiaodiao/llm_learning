<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" width="1360" height="620" role="img" aria-label="普通模型每个词过完整的一大块；混合专家把它拆成八个小块，分派员只让每个词过两个，总参数大而每词计算小"><rect width="680" height="310" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">每个词只叫两个专家</text><rect x="24" y="60" width="200" height="200" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="124" y="82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937">普通模型</text><text x="124" y="98" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">每一层里最大的那块</text><rect x="44" y="110" width="160" height="90" rx="6" fill="#ffe4e6" stroke="#be123c" stroke-width="1.3"/><text x="124" y="150" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#be123c">一大块</text><text x="124" y="168" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1f2937">每个词全过一遍</text><text x="124" y="226" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">总参数 = 每个词用到的</text><text x="124" y="242" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">700 亿就是每词算 700 亿</text><rect x="248" y="60" width="408" height="200" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="452" y="82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#2563eb">混合专家（MoE）</text><text x="452" y="98" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">同一块拆成八个小块，前面一个分派员</text><rect x="402" y="108" width="100" height="22" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="452" y="123" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#2563eb">分派员：看一眼</text><rect x="266" y="150" width="40" height="44" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="286" y="168" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#6b7280">专家</text><text x="286" y="184" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="9.5" font-weight="400" fill="#6b7280">1</text><text x="286" y="206" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="8" font-weight="400" fill="#6b7280">歇着</text><rect x="314" y="150" width="40" height="44" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="334" y="168" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#6b7280">专家</text><text x="334" y="184" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="9.5" font-weight="400" fill="#6b7280"