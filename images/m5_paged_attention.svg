<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="1360" height="860">
<rect width="680" height="430" fill="#ffffff"/>
<text x="20" y="24" font-family="Noto Sans CJK SC" font-size="13" fill="#1f2937" text-anchor="start" font-weight="600">朴素做法：每个请求按“最大可能长度”预留一整块连续显存</text>
<text x="30" y="52" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">请求A</text>
<rect x="90" y="40" width="90" height="20" rx="2" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<rect x="180" y="40" width="330" height="20" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2"/>
<text x="520" y="55" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">实际用 90，预留一大条 → 全是留白</text>
<text x="30" y="82" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">请求B</text>
<rect x="90" y="70" width="150" height="20" rx="2" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<rect x="240" y="70" width="270" height="20" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2"/>
<text x="30" y="112" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">空闲</text>
<rect x="90" y="100" width="200" height="20" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2"/>
<text x="300" y="115" font-family="Noto Sans CJK SC" font-size="11" fill="#2563eb" text-anchor="start" font-weight="600">总空闲够，却被切成碎片，塞不下新请求（碎片化）</text>
<text x="20" y="168" font-family="Noto Sans CJK SC" font-size="13" fill="#1f2937" text-anchor="start" font-weight="600">PagedAttention：KV cache 切成固定大小的小块，按需分配、可不连续</text>
<text x="30" y="200" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">物理显存（一格 = 一个 block）</text>
<rect x="90" y="212" width="34" height="24" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
<text x="107" y="228" font-family="Noto Sans CJK SC" font-size="10" fill="#1f2937" text-anchor="middle">A0</text>
<rect x="128" y="212" width="34" height="24" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
<text x="145" y="228" font-family="Noto Sans CJK SC" font-size="10" fill="#1f2937" text-anchor="middle">B0</text>
<rect x="166" y="212" width="34" height="24" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
<text x="183" y="228" font-family="Noto Sans CJK SC" font-size="10" fill="#1f2937" text-anchor="middle">A1</text>
<rect x="204" y="212" width="34" height="24" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2"/>
<rect x="242" y="212" width="34" height="24" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
<text x="259" y="228" font-family="Noto Sans CJK SC" font-size="10" fill="#1f2937" text-anchor="middle">B1</text>
<rect x="280" y="212" width="34" height="24" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
<text x="297" y="228" font-family="Noto Sans CJK SC" font-size="10" fill="#1f2937" text-anchor="middle">A2</text>
<rect x="318" y="212" width="34" height="24" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2"/>
<rect x="356" y="212" width="34" height="24" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
<text x="373" y="228" font-family="Noto Sans CJK SC" font-size="10" fill="#1f2937" text-anchor="middle">B2</text>
<rect x="394" y="212" width="34" height="24" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2"/>
<rect x="432" y="212" width="34" height="24" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2"/>
<text x="480" y="228" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">按需分配，用一块给一块</text>
<text x="30" y="286" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">block table（每个请求记：我的第几块 → 物理哪一格）</text>
<rect x="90" y="300" width="230" height="72" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="104" y="322" font-family="Noto Sans CJK SC" font-size="11" fill="#2563eb" text-anchor="start" font-weight="600">请求A：逻辑块 0,1,2</text>
<text x="104" y="342" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="start">→ 物理 A0, A1, A2（不连续也没关系）</text>
<text x="104" y="362" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="start">读时按表找块，逻辑上仍是连续序列</text>
<rect x="336" y="300" width="324" height="72" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="350" y="322" font-family="Noto Sans CJK SC" font-size="12" fill="#1f2937" text-anchor="start" font-weight="600">这就是操作系统“虚拟内存分页”的思想</text>
<text x="350" y="344" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">碎片几乎归零 → 同一张卡能同时服务的请求数</text>
<text x="350" y="362" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">大幅增加。真实代码：vLLM 的 BlockManager。</text>
<text x="20" y="404" font-family="Noto Sans CJK SC" font-size="11" fill="#2563eb" text-anchor="start" font-weight="600">一句话：把“预留一大块连续内存”换成“按小块动态分配 + 一张映射表”，浪费从一半以上降到几乎为零。</text>
</svg>
