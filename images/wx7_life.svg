<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="1360" height="600" role="img" aria-label="模型的一生：随机数经预训练成基座模型，经指令微调会按格式答，经对齐成聊天助手；下一步是推理"><rect width="680" height="300" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">到这里，模型的一生走了四步</text><rect x="24" y="96" width="134" height="44" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="91" y="123.04" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#6b7280">随机数</text><rect x="190" y="96" width="134" height="44" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="257" y="123.04" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1f2937">基座模型</text><rect x="356" y="96" width="134" height="44" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="423" y="123.04" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1f2937">会按格式答</text><rect x="522" y="96" width="134" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="589" y="123.04" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#2563eb">聊天助手</text><line x1="162" y1="118" x2="186" y2="118" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/><text x="174" y="82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#be123c">预训练</text><text x="174" y="164" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280">几万亿词上猜下一个词</text><line x1="328" y1="118" x2="352" y2="118" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/><text x="340" y="82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#be123c">指令微调</text><text x="340" y="164" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280">几万段对话</text><line x1="494" y1="118" x2="518" y2="118" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/><text x="506" y="82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#be123c">对齐</text><text x="506" y="164" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280">几万组人的选择</text><rect x="522" y="196" width="134" height="40" rx="6" fill="#ffffff" stroke="#be123c" stroke-width="1.5" stroke-dasharray="5 3"/><text x="589" y="221" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#be123c">会"想一会儿"</text><line x1="589" y1="144" x2="589" y2="190" stroke="#be123c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/><text x="600" y="174" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#be123c">下一课</text><text x="24" y="226" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2937">四步都是同一个