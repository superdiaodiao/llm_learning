family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#6b7280">第 7 课的偏好数据就是这个形式</text><text x="24" y="290" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">几十个真实的翻车例子，比几千条编出来的测试题管用。没有这套测试的助手，每次更新都是在赌。</text></svg>