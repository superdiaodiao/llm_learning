<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="1360" height="680" role="img" aria-label="Dense block 每个 token 过完整 FFN；MoE block 用路由器把每个 token 只送给 8 个专家中的 2 个，总参数大而每 token 计算量小"><rect width="680" height="340" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Dense 与 MoE：每个 token 只叫两个专家</text><rect x="24" y="62" width="220" height="210" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="134" y="84" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937">Dense block</text><rect x="54" y="100" width="160" height="30" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="134" y="119" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#1f2937">Attention</text><line x1="134" y1="132" x2="134" y2="148" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><rect x="54" y="150" width="160" height="70" rx="4" fill="#ffe4e6" stroke="#be123c" stroke-width="1.3"/><text x="134" y="180" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="700" fill="#be123c">FFN（一个，很大）</text><text x="134" y="198" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1f2937">每个 token 全过一遍</text><text x="134" y="246" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">总参数 = 每 token 参与计算的参数</text><text x="134" y="260" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">例：70B dense，每 token 算 70B</text><rect x="268" y="62" width="388" height="210" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="462" y="84" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#2563eb">MoE block（Mixtral 8x7B）</text><rect x="382" y="100" width="160" height="30" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="462" y="119" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#1f2937">Attention（共享）</text><line x1="462" y1="132" x2="462" y2="146" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><rect x="402" y="148" width="120" height="22" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="462" y="163" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="700" fill="#2563eb">路由器：线性层 + softmax + top-2</text><rect x="288" y="190" width="38" height="36" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="307" y="206" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#6b7280">专家</text><text x="307" y="219" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="9" font-weight="400" fill="#6b7280">1</text><rect x="333" y="190" width="38" height="36" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="352" y="206" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#6b7280">专家</text><text x="352" y="219" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="9" font-weight="400" fill="#6b7280">2</text><rect x="378" y="190" width="38" height="36" rx="4" fill="#ffe4e6" stroke="#be123c" stroke-width="1.3"/><text x="397" y="206" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="600" fill="#be123c">专家</text><text x="397" y="219" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="9" font-weight="700" fill="#be123c">3</text><line x1="462" y1="172" x2="397" y2="188" stroke="#be123c" stroke-width="2" marker-end="url(#ar)"/><rect x="423" y="190" width="38" height="36" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="442" y="206" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#6b7280">专家</text><text x="442" y="219" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="9" font-weight="400" fill="#6b7280">4</text><rect x="468" y="190" width="38" height="36" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="487" y="206" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#6b7280">专家</text><text x="487" y="219" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="9" font-weight="400" fill="#6b7280">5</text><rect x="513" y="190" width="38" height="36" rx="4" fill="#ffe4e6" stroke="#be123c" stroke-width="1.3"/><text x="532" y="206" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="600" fill="#be123c">专家</text><text x="532" y="219" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="9" font-weight="700" fill="#be123c">6</text><line x1="462" y1="172" x2="532" y2="188" stroke="#be123c" stroke-width="2" marker-end="url(#ar)"/><rect x="558" y="190" width="38" height="36" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="577" y="206" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#6b7280">专家</text><text x="577" y="219" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="9" font-weight="400" fill="#6b7280">7</text><rect x="603" y="190" width="38" height="36" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="622" y="206" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#6b7280">专家</text><text x="622" y="219" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="9" font-weight="400" fill="#6b7280">8</text><text x="462" y="246" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#1f2937">总参数 46.7B，每 token 只算 12.9B；能力接近同期 70B dense</text><text x="462" y="260" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">专家分工是训练时自己长出来的；负载均衡损失防止富者愈富</text><text x="24" y="302" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">MoE 省的是算，不是搬：所有专家都得在显存里，因为下一个 token 可能选任何一个。</text><text x="24" y="322" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">适合有大量显存、追求吞吐的服务方；单卡跑本地模型，同样显存下 dense 往往更划算。</text></svg>