<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 302" width="1360" height="604" role="img" aria-label="两种做法：走一步看一步适合两三步的事；十几步的事先让强模型列计划，小模型逐步执行，做完回头改计划"><rect width="680" height="302" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">走一步看一步，还是先列计划</text><rect x="24" y="60" width="300" height="190" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="174" y="82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="700" fill="#1f2937">走一步看一步</text><text x="174" y="98" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#6b7280">每一步看着最新结果定下一步</text><line x1="50" y1="150" x2="110" y2="130" stroke="#9ca3af" stroke-width="2" marker-end="url(#ah)"/><line x1="110" y1="130" x2="170" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#ah)"/><line x1="170" y1="170" x2="230" y2="140" stroke="#9ca3af" stroke-width="2" marker-end="url(#ah)"/><line x1="230" y1="140" x2="200" y2="200" stroke="#be123c" stroke-width="2" marker-end="url(#ar)"/><line x1="200" y1="200" x2="260" y2="205" stroke="#be123c" stroke-width="2" marker-end="url(#ar)"/><line x1="260" y1="205" x2="290" y2="160" stroke="#be123c" stroke-width="2" marker-end="url(#ar)"/><circle cx="50" cy="150" r="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><circle cx="110" cy="130" r="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><circle cx="170" cy="170" r="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><circle cx="230" cy="140" r="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><circle cx="200" cy="200" r="6" fill="#ffffff" stroke="#be123c" stroke-width="1.5"/><circle cx="260" cy="205" r="6" fill="#ffffff" stroke="#be123c" stroke-width="1.5"/><circle cx="290" cy="160" r="6" fill="#ffffff" stroke="#be123c" stroke-width="1.5"/><text x="174" y="236" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#6b7280">两三步够用；十几步容易绕圈、跑偏</text><rect x="356" y="60" width="300" height="190" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="506" y="82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="700" fill="#1f2937">先列计划，再一步步做</text><text x="506" y="98" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#6b7280">做完一步回头看，计划还成立吗</text><rect x="370" y="108" width="120" height="118" rx="5" fill="#ffe4e6" stroke="#be123c" stroke-width="1.3"/><text x="430" y="124" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#be123c">计划（强模型，一次）</text><text x="380" y="142" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1f2937">1 查天气</text><text x="380" y="158" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1f2937">2 查日程</text><text x="380" y="174" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1f2937">3 判断冲突</text><text x="380" y="190" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1f2937">4 改闹钟</text><text x="380" y="206" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1f2937">5 通知</text><line x1="494" y1="121" x2="512" y2="121" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><rect x="516" y="112" width="100" height="18" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="566" y="124.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="600" fill="#2563eb">执行（小模型）</text><line x1="494" y1="144" x2="512" y2="144" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><rect x="516" y="135" width="100" height="18" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="566" y="147.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="600" fill="#2563eb">执行（小模型）</text><line x1="494" y1="167" x2="512" y2="167" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><rect x="516" y="158" width="100" height="18" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="566" y="170.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#6b7280">待执行</text><line x1="494" y1="190" x2="512" y2="190" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><rect x="516" y="181" width="100" height="18" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="566" y="193.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#6b7280">待执行</text><line x1="494" y1="213" x2="512" y2="213" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><rect x="516" y="204" width="100" height="18" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="566" y="216.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#6b7280">待执行</text><path d="M 616 106 L 636 106 L 636 232 L 616 232" fill="none" stroke="#be123c" stroke-width="1.2" stroke-dasharray="3 3"/><text x="506" y="240" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#be123c">回头改计划</text><text x="24" y="284" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">省钱的门道：列计划最难，用最强的模型，只做一次；每一步任务很窄，用便宜的小模型。</text></svg>