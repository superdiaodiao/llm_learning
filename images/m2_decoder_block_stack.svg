<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="1360" height="1120">
<rect width="680" height="560" fill="#ffffff"/>
<text x="20" y="24" font-family="Noto Sans CJK SC" font-size="13" fill="#1f2937" text-anchor="start" font-weight="600">一个 block（LlamaDecoderLayer）内部</text>
<rect x="40" y="40" width="300" height="430" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<rect x="150" y="52" width="120" height="30" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="210" y="72" font-family="Noto Sans CJK SC" font-size="12" fill="#4b5563" text-anchor="middle">输入向量</text>
<line x1="210" y1="82" x2="210" y2="100" stroke="#9ca3af" stroke-width="1.6"/>
<polygon points="210,100 214.0,92.0 206.0,92.0" fill="#9ca3af"/>
<rect x="120" y="102" width="180" height="30" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
<text x="210" y="122" font-family="Noto Sans CJK SC" font-size="12" fill="#4b5563" text-anchor="middle">RMSNorm（稳定数值）</text>
<line x1="210" y1="132" x2="210" y2="150" stroke="#9ca3af" stroke-width="1.6"/>
<polygon points="210,150 214.0,142.0 206.0,142.0" fill="#9ca3af"/>
<rect x="120" y="152" width="180" height="40" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
<text x="210" y="170" font-family="Noto Sans CJK SC" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="600">Attention</text>
<text x="210" y="185" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="middle">词之间横向交流</text>
<line x1="210" y1="192" x2="210" y2="200" stroke="#2563eb" stroke-width="1.6"/>
<polygon points="210,200 214.0,192.0 206.0,192.0" fill="#2563eb"/>
<circle cx="210" cy="212" r="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="210" y="217" font-family="Noto Sans CJK SC" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="600">＋</text>
<path d="M60,67 L60,212 L197,212" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="4,3"/>
<polygon points="197,212 189.0,208.0 189.0,216.0" fill="#2563eb"/>
<text x="46" y="300" font-family="Noto Sans CJK SC" font-size="11" fill="#2563eb" text-anchor="start" font-weight="600">残差旁路</text>
<text x="46" y="316" font-family="Noto Sans CJK SC" font-size="11" fill="#2563eb" text-anchor="start">只把“改动量”</text>
<text x="46" y="332" font-family="Noto Sans CJK SC" font-size="11" fill="#2563eb" text-anchor="start">加回原值</text>
<line x1="210" y1="224" x2="210" y2="242" stroke="#9ca3af" stroke-width="1.6"/>
<polygon points="210,242 214.0,234.0 206.0,234.0" fill="#9ca3af"/>
<rect x="120" y="244" width="180" height="30" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
<text x="210" y="264" font-family="Noto Sans CJK SC" font-size="12" fill="#4b5563" text-anchor="middle">RMSNorm</text>
<line x1="210" y1="274" x2="210" y2="292" stroke="#9ca3af" stroke-width="1.6"/>
<polygon points="210,292 214.0,284.0 206.0,284.0" fill="#9ca3af"/>
<rect x="120" y="294" width="180" height="40" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
<text x="210" y="312" font-family="Noto Sans CJK SC" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="600">MLP</text>
<text x="210" y="327" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="middle">每个词各自纵向加工</text>
<line x1="210" y1="334" x2="210" y2="342" stroke="#2563eb" stroke-width="1.6"/>
<polygon points="210,342 214.0,334.0 206.0,334.0" fill="#2563eb"/>
<circle cx="210" cy="354" r="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="210" y="359" font-family="Noto Sans CJK SC" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="600">＋</text>
<path d="M60,230 L60,354 L197,354" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="4,3"/>
<polygon points="197,354 189.0,350.0 189.0,358.0" fill="#2563eb"/>
<line x1="210" y1="366" x2="210" y2="384" stroke="#9ca3af" stroke-width="1.6"/>
<polygon points="210,384 214.0,376.0 206.0,376.0" fill="#9ca3af"/>
<rect x="150" y="386" width="120" height="30" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="210" y="406" font-family="Noto Sans CJK SC" font-size="12" fill="#4b5563" text-anchor="middle">输出向量</text>
<text x="60" y="440" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">一层 = 先让词互相交流，</text>
<text x="60" y="456" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">再让每个词各自消化一遍。</text>
<text x="380" y="24" font-family="Noto Sans CJK SC" font-size="13" fill="#1f2937" text-anchor="start" font-weight="600">把这个 block 叠 N 层</text>
<rect x="430" y="44" width="200" height="28" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="530" y="63" font-family="Noto Sans CJK SC" font-size="12" fill="#4b5563" text-anchor="middle">embed_tokens（查表）</text>
<line x1="530" y1="72" x2="530" y2="86" stroke="#9ca3af" stroke-width="1.6"/>
<polygon points="530,86 534.0,78.0 526.0,78.0" fill="#9ca3af"/>
<rect x="430" y="88" width="200" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="530" y="108" font-family="Noto Sans CJK SC" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="600">Block 1  抓局部：词、短语</text>
<line x1="530" y1="118" x2="530" y2="130" stroke="#9ca3af" stroke-width="1.6"/>
<polygon points="530,130 534.0,122.0 526.0,122.0" fill="#9ca3af"/>
<rect x="430" y="132" width="200" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="530" y="152" font-family="Noto Sans CJK SC" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="600">Block 2  在半成品上再加工</text>
<line x1="530" y1="162" x2="530" y2="174" stroke="#9ca3af" stroke-width="1.6"/>
<polygon points="530,174 534.0,166.0 526.0,166.0" fill="#9ca3af"/>
<text x="530" y="192" font-family="Noto Sans CJK SC" font-size="14" fill="#4b5563" text-anchor="middle">· · ·</text>
<line x1="530" y1="198" x2="530" y2="210" stroke="#9ca3af" stroke-width="1.6"/>
<polygon points="530,210 534.0,202.0 526.0,202.0" fill="#9ca3af"/>
<rect x="430" y="212" width="200" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="530" y="232" font-family="Noto Sans CJK SC" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="600">Block 32  抓全局：语义、逻辑</text>
<line x1="530" y1="242" x2="530" y2="254" stroke="#9ca3af" stroke-width="1.6"/>
<polygon points="530,254 534.0,246.0 526.0,246.0" fill="#9ca3af"/>
<rect x="430" y="256" width="200" height="28" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
<text x="530" y="275" font-family="Noto Sans CJK SC" font-size="12" fill="#4b5563" text-anchor="middle">最终 RMSNorm</text>
<line x1="530" y1="284" x2="530" y2="296" stroke="#9ca3af" stroke-width="1.6"/>
<polygon points="530,296 534.0,288.0 526.0,288.0" fill="#9ca3af"/>
<rect x="430" y="298" width="200" height="30" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="530" y="318" font-family="Noto Sans CJK SC" font-size="12" fill="#4b5563" text-anchor="middle">懂了上下文的向量</text>
<rect x="380" y="350" width="270" height="120" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="394" y="374" font-family="Noto Sans CJK SC" font-size="13" fill="#1f2937" text-anchor="start" font-weight="600">流水线的比喻</text>
<text x="394" y="398" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">每个 block 是流水线上的一站。</text>
<text x="394" y="418" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">浅层站：认出词和短语。</text>
<text x="394" y="438" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">深层站：在前面加工过的半成品上，</text>
<text x="394" y="458" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">拼出句子的语义和逻辑关系。</text>
</svg>
