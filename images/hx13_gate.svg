<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 304" width="1360" height="608" role="img" aria-label="Hook 是工具执行前后两个停顿点上的代码：执行前拦危险命令或问人，执行后裁剪、脱敏、记日志；模型绕不过去"><rect width="680" height="304" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">嘱咐可能忘，门禁不会</text><rect x="24" y="66" width="112" height="30" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3"/><text x="80" y="85" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="500" fill="#1f2937">模型：写一行调用</text><line x1="138" y1="81" x2="152" y2="81" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><rect x="154" y="66" width="112" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/><text x="210" y="85" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#2563eb">执行前 Hook</text><line x1="268" y1="81" x2="282" y2="81" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><rect x="284" y="66" width="112" height="30" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3"/><text x="340" y="85" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="500" fill="#1f2937">程序执行</text><line x1="398" y1="81" x2="412" y2="81" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><rect x="414" y="66" width="112" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/><text x="470" y="85" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#2563eb">执行后 Hook</text><line x1="528" y1="81" x2="542" y2="81" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><rect x="544" y="66" width="112" height="30" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3"/><text x="600" y="85" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="500" fill="#1f2937">写回窗口</text><rect x="60" y="112" width="220" height="120" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/><text x="170" y="132" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#2563eb">执行前：看要调什么</text><rect x="74" y="144" width="192" height="18" rx="3" fill="#ffe4e6" stroke="#be123c" stroke-width="1"/><text x="170" y="157" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#be123c">rm -rf → 停下来问你</text><rect x="74" y="168" width="192" height="18" rx="3" fill="#ffe4e6" stroke="#be123c" stroke-width="1"/><text x="170" y="181" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#be123c">改 migrations/ → 拦</text><rect x="74" y="192" width="192" height="18" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1"/><text x="170" y="205" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#15803d">普通读文件 → 放行</text><text x="170" y="224" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">这是刹车</text><rect x="400" y="112" width="220" height="120" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/><text x="510" y="132" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#2563eb">执行后：看拿到了什么</text><rect x="414" y="144" width="192" height="18" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="510" y="157" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#2563eb">3000 行输出 → 留 50 行</text><rect x="414" y="168" width="192" height="18" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="510" y="181" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#2563eb">日志里有密码 → 打码</text><rect x="414" y="192" width="192" height="18" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="510" y="205" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#2563eb">记一行：几点跑了什么</text><text x="510" y="224" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">裁剪、脱敏、留痕</text><rect x="292" y="140" width="96" height="64" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.1" stroke-dasharray="4 3"/><text x="340" y="162" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#1f2937">模型不知道</text><text x="340" y="178" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#1f2937">Hook 存在</text><text x="340" y="194" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#6b7280">也绕不过去</text><text x="24" y="266" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">写在提示里的规则，把坏选项的概率压得很低，压不到零。Hook 是代码，跑在模型外面，百分之百执行。</text><text x="24" y="286" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">最值得配的三个：危险命令拦截、大段输出裁剪、操作日志。</text></svg>