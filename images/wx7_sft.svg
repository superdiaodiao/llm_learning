<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="1360" height="680" role="img" aria-label="指令微调：还是猜下一个词，材料从网页换成带说话人标签的对话记录"><rect width="680" height="340" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">换材料，不换游戏：还是猜下一个词</text><text x="24" y="76" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">预训练的材料：网页</text><rect x="24" y="84" width="290" height="150" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3"/><text x="40" y="110" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937">法国的首都是哪里？</text><text x="40" y="134" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280">这是本课堂第一个问题。</text><text x="40" y="158" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280">第二个问题：德国呢？</text><text x="40" y="182" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280">【广告】留学咨询点这里</text><text x="40" y="206" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280">楼主问得好，顶一下</text><text x="169" y="262" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#be123c">问题后面跟着的，经常不是答案</text><text x="366" y="76" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">指令微调的材料：人写的对话</text><rect x="366" y="84" width="290" height="150" rx="8" fill="#fcfcfd" stroke="#2563eb" stroke-width="1.6"/><rect x="382" y="98" width="44" height="22" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="404" y="112.96" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#2563eb">用户</text><text x="434" y="114" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937">法国的首都是哪里？</text><rect x="382" y="134" width="44" height="22" rx="4" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><text x="404" y="148.96" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#be123c">助手</text><text x="434" y="150" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937">巴黎。</text><rect x="382" y="170" width="44" height="22" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="404" y="184.96" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#2563eb">用户</text><text x="434" y="186" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937">那德国呢？</text><rect x="382" y="206" width="44" height="22" rx="4" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><text x="404" y="220.96" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#be123c">助手</text><text x="434" y="222" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937">柏林。</text><text x="511" y="262" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#2563eb">"助手："后面，永远是答案</text><line x1="24" y1="282" x2="656" y2="282" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><text x="24" y="312" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2937">几万段就够：它不是在学知识，是在学"问题后面该接答案"这个格式。</text></svg>