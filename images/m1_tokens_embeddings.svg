<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="1360" height="940">
<rect width="680" height="470" fill="#ffffff"/>
<text x="20" y="26" font-family="Noto Sans CJK SC" font-size="14" fill="#1f2937" text-anchor="start" font-weight="600">① 一句话</text>
<rect x="20" y="36" width="150" height="40" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="95" y="61" font-family="Noto Sans CJK SC" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="600">"the cat sat"</text>
<text x="200" y="26" font-family="Noto Sans CJK SC" font-size="14" fill="#1f2937" text-anchor="start" font-weight="600">② 分词器 (BPE)</text>
<rect x="200" y="36" width="200" height="40" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="300" y="61" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="middle">["the", "cat", "sat"]</text>
<text x="430" y="26" font-family="Noto Sans CJK SC" font-size="14" fill="#1f2937" text-anchor="start" font-weight="600">③ 查词表 → id</text>
<rect x="430" y="36" width="230" height="40" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="545" y="61" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="middle">[1996, 4937, 2938]</text>
<line x1="170" y1="56" x2="198" y2="56" stroke="#9ca3af" stroke-width="1.6"/>
<polygon points="198,56 190.0,52.0 190.0,60.0" fill="#9ca3af"/>
<line x1="400" y1="56" x2="428" y2="56" stroke="#9ca3af" stroke-width="1.6"/>
<polygon points="428,56 420.0,52.0 420.0,60.0" fill="#9ca3af"/>
<line x1="545" y1="78" x2="545" y2="104" stroke="#9ca3af" stroke-width="1.6"/>
<polygon points="545,104 549.0,96.0 541.0,96.0" fill="#9ca3af"/>
<text x="556" y="96" font-family="Noto Sans CJK SC" font-size="12" fill="#2563eb" text-anchor="start" font-weight="600">用 id 当行号去查表</text>
<text x="20" y="126" font-family="Noto Sans CJK SC" font-size="13" fill="#1f2937" text-anchor="start" font-weight="600">④ Embedding 矩阵 = 一张巨大的查找表   shape = [词表大小, 隐藏维度]，例如 [128000, 4096]</text>
<rect x="20" y="140" width="640" height="120" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="34" y="164" font-family="Noto Sans CJK SC" font-size="12" fill="#1f2937" text-anchor="start">行 0        [ 0.12  -0.03   0.88  ...  0.41 ]   ← 4096 个浮点数</text>
<text x="34" y="188" font-family="Noto Sans CJK SC" font-size="12" fill="#1f2937" text-anchor="start">行 1996  [ 0.51   0.22  -0.10  ... -0.07 ]   ← "the" 的向量</text>
<text x="34" y="212" font-family="Noto Sans CJK SC" font-size="12" fill="#1f2937" text-anchor="start">行 4937  [-0.44   0.71   0.05  ...  0.63 ]   ← "cat" 的向量</text>
<text x="34" y="236" font-family="Noto Sans CJK SC" font-size="12" fill="#1f2937" text-anchor="start">行 2938  [ 0.09  -0.55   0.30  ...  0.18 ]   ← "sat" 的向量</text>
<text x="20" y="288" font-family="Noto Sans CJK SC" font-size="11" fill="#2563eb" text-anchor="start" font-weight="600">查表就是这么简单：id 是行号，取出那一行就是这个 token 的向量。真实代码里叫 LlamaModel.embed_tokens（一个 nn.Embedding）。</text>
<text x="20" y="330" font-family="Noto Sans CJK SC" font-size="13" fill="#1f2937" text-anchor="start" font-weight="600">⑤ 这些向量住在“语义空间”里——训练让意思相近的词彼此靠近</text>
<rect x="20" y="344" width="640" height="150" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<circle cx="140" cy="400" r="4" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="150" y="404" font-family="Noto Sans CJK SC" font-size="12" fill="#2563eb" text-anchor="start" font-weight="600">king</text>
<circle cx="185" cy="420" r="4" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="195" y="424" font-family="Noto Sans CJK SC" font-size="12" fill="#2563eb" text-anchor="start" font-weight="600">queen</text>
<circle cx="160" cy="378" r="4" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="170" y="382" font-family="Noto Sans CJK SC" font-size="12" fill="#2563eb" text-anchor="start" font-weight="600">prince</text>
<text x="110" y="460" font-family="Noto Sans CJK SC" font-size="12" fill="#4b5563" text-anchor="start">王室一簇（挨得近）</text>
<circle cx="430" cy="410" r="4" fill="#4b5563" stroke="#4b5563" stroke-width="1.5"/>
<text x="440" y="414" font-family="Noto Sans CJK SC" font-size="12" fill="#4b5563" text-anchor="start">cat</text>
<circle cx="470" cy="392" r="4" fill="#4b5563" stroke="#4b5563" stroke-width="1.5"/>
<text x="480" y="396" font-family="Noto Sans CJK SC" font-size="12" fill="#4b5563" text-anchor="start">dog</text>
<circle cx="450" cy="430" r="4" fill="#4b5563" stroke="#4b5563" stroke-width="1.5"/>
<text x="460" y="434" font-family="Noto Sans CJK SC" font-size="12" fill="#4b5563" text-anchor="start">kitten</text>
<text x="410" y="460" font-family="Noto Sans CJK SC" font-size="12" fill="#4b5563" text-anchor="start">动物一簇（离王室很远）</text>
<text x="20" y="486" font-family="Noto Sans CJK SC" font-size="12" fill="#2563eb" text-anchor="start" font-weight="600">“相近”用向量夹角（余弦相似度）衡量——这正是 RAG 检索在算的东西。</text>
</svg>
