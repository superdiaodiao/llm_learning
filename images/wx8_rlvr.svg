<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="1360" height="680" role="img" aria-label="推理训练：有标准答案的题，模型自己写多份思考和答案，答对的加分，答对的那类想法概率上升"><rect width="680" height="340" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">不教它怎么想，只告诉它对没对</text><rect x="24" y="66" width="190" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="119" y="90.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937">一道有标准答案的题</text><line x1="220" y1="86" x2="246" y2="86" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><text x="254" y="80" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">让它自己写思考 + 答案，</text><text x="254" y="96" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">同一道题写好几遍</text><rect x="24" y="118" width="440" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/><text x="36" y="137" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">先算 23×10，再算 23×7，相加……391</text><text x="490" y="137" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="600" fill="#2563eb">✓ 对，加分</text><rect x="24" y="152" width="440" height="28" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3"/><text x="36" y="171" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280">23×17 大约是 400，所以 400</text><text x="490" y="171" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="600" fill="#be123c">✗ 错，不加</text><rect x="24" y="186" width="440" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/><text x="36" y="205" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">等等，我重新看一下这步……391</text><text x="490" y="205" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="600" fill="#2563eb">✓ 对，加分</text><rect x="24" y="220" width="440" height="28" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3"/><text x="36" y="239" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280">直接是 361</text><text x="490" y="239" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="600" fill="#be123c">✗ 错，不加</text><line x1="24" y1="262" x2="656" y2="262" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><text x="24" y="292" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2937">挪数字，让答对的那几遍里出现的想法，以后出现的概率变高。</text><text x="24" y="318" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937">"回头检查"没人教过，它自己发现会回头看的那几遍答对得多。</text></svg>