<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="1360" height="680" role="img" aria-label="要猜准下一个词，绕不开地理、指代、词与词的关系；这些没人教，是猜错逼出来的"><rect width="680" height="340" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">为什么猜词猜多了，它就"懂"了</text><rect x="24" y="70" width="300" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3"/><text x="38" y="95" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#1f2937">巴黎是法国的 ___</text><rect x="336" y="70" width="56" height="40" rx="6" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><text x="364" y="94.68" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#be123c">首都</text><line x1="400" y1="90" x2="424" y2="90" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><text x="432" y="95" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="600" fill="#2563eb">得知道地理</text><rect x="24" y="130" width="300" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3"/><text x="38" y="155" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#1f2937">她把书放在桌上，然后拿起 ___</text><rect x="336" y="130" width="56" height="40" rx="6" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><text x="364" y="154.68" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#be123c">它</text><line x1="400" y1="150" x2="424" y2="150" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><text x="432" y="155" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="600" fill="#2563eb">得懂指代</text><rect x="24" y="190" width="300" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3"/><text x="38" y="215" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#1f2937">国王的妻子是 ___</text><rect x="336" y="190" width="56" height="40" rx="6" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><text x="364" y="214.68" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#be123c">王后</text><line x1="400" y1="210" x2="424" y2="210" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><text x="432" y="215" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="600" fill="#2563eb">得让"国王""王后"的数字靠近（第 2 课）</text><line x1="24" y1="256" x2="656" y2="256" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><text x="24" y="288" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2937">没人专门教过它任何一条。它只是发现：不懂这些，就猜不准。</text><text x="24" y="314" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#1f2937">几万亿次纠错之后，这些规律被压进了那几十亿个数字里。</text></svg>