<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="1360" height="840" role="img" aria-label="语义地图：王室的词挤在一块，动物的词挤在另一块"><rect width="680" height="420" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">意思，变成了距离</text><rect x="24" y="56" width="632" height="306" rx="12" fill="#fcfcfd" stroke="#9ca3af" stroke-width="1.2"/><circle cx="178" cy="150" r="92" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.85"/><text x="178" y="48" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="600" fill="#2563eb">王室</text><circle cx="150" cy="118" r="4.5" fill="#2563eb"/><text x="160" y="123" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1f2937">国王</text><circle cx="218" cy="140" r="4.5" fill="#2563eb"/><text x="228" y="145" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1f2937">女王</text><circle cx="162" cy="190" r="4.5" fill="#2563eb"/><text x="172" y="195" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1f2937">王子</text><circle cx="216" cy="196" r="4.5" fill="#2563eb"/><text x="226" y="201" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1f2937">公主</text><circle cx="486" cy="232" r="86" fill="#ffe4e6" stroke="#be123c" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.85"/><text x="486" y="136" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="600" fill="#be123c">动物</text><circle cx="452" cy="200" r="4.5" fill="#be123c"/><text x="462" y="205" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1f2937">猫</text><circle cx="508" cy="218" r="4.5" fill="#be123c"/><text x="518" y="223" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1f2937">小猫</text><circle cx="486" cy="282" r="4.5" fill="#be123c"/><text x="496" y="287" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1f2937">狗</text><line x1="267" y1="174" x2="403" y2="210" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/><text x="335" y="166" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">离得远 = 意思差得远</text><line x1="466" y1="206" x2="500" y2="216" stroke="#be123c" stroke-width="1.6"/><text x="486" y="344" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">同一簇里，猫和小猫比猫和狗更近</text><text x="24" y="390" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280">图上只画了两维。真实是 4096 维，画不出来，但道理一样。</text></svg>