scription</text><rect x="356" y="60" width="300" height="210" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="506" y="82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#2563eb">有无对比：用了它真的更好吗</text><text x="436" y="106" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#6b7280">不带 Skill</text><text x="576" y="106" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#6b7280">带 Skill</text><rect x="372" y="116" width="128" height="26" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="436" y="133" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#6b7280">三段，700 字</text><rect x="512" y="116" width="128" height="26" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1"/><text x="576" y="133" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="600" fill="#15803d">三段，180 字</text><rect x="372" y="150" width="128" height="26" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="436" y="167" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#6b7280">数字对，无出处</text><rect x="512" y="150" width="128" height="26" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1"/><text x="576" y="167" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="600" fill="#15803d">数字对，有出处</text><rect x="372" y="184" width="128" height="26" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="436" y="201" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#6b7280">文件名 report.pdf</text><rect x="512" y="184" width="128" height="26" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1"/><text x="576" y="201" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="600" fill="#15803d">文件名 Q3-0919.pdf</text><text x="506" y="232" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#1f2937">并排比"哪个更好"，别打分</text><text x="506" y="250" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#be123c">差别看不出来 → 它在占窗口没干活，删</text><text x="24" y="302" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">改了不测，等于在赌。测试句从真正说过的话里挑，每次改完重跑。</text></svg>