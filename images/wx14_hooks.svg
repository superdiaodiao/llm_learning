<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="1360" height="580" role="img" aria-label="写在提示里的规则模型大概率执行；工具执行前后各设一道代码关卡则百分之百执行"><rect width="680" height="290" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">写在提示里，和设一道关卡</text><rect x="24" y="62" width="300" height="176" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="174" y="84" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="700" fill="#1f2937">嘱咐：写在规则里</text><rect x="38" y="96" width="272" height="30" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3"/><text x="174" y="115" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#6b7280">"不要删文件"</text><text x="174" y="148" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#1f2937">模型多半会听</text><text x="174" y="166" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#6b7280">但可能忘、可能被文档里一句话骗了</text><text x="174" y="184" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#6b7280">它本质在抽签（第 4 课）</text><rect x="38" y="200" width="272" height="24" rx="4" fill="#ffe4e6" stroke="#be123c" stroke-width="1.2"/><text x="174" y="216" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#be123c">大概率执行</text><rect x="356" y="62" width="300" height="176" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="506" y="84" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="700" fill="#1f2937">门禁：工具前后各一道</text><rect x="368" y="100" width="50" height="26" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="393" y="117" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#1f2937">模型写调用</text><line x1="419" y1="113" x2="424" y2="113" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#ah)"/><rect x="424" y="100" width="50" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="449" y="117" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="600" fill="#2563eb">执行前</text><line x1="475" y1="113" x2="480" y2="113" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#ah)"/><rect x="480" y="100" width="50" height="26" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="505" y="117" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#1f2937">真的执行</text><line x1="531" y1="113" x2="536" y2="113" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#ah)"/><rect x="536" y="100" width="50" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="561" y="117" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="600" fill="#2563eb">执行后</text><line x1="587" y1="113" x2="592" y2="113" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#ah)"/><rect x="592" y="100" width="50" height="26" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="617" y="117" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#1f2937">写回窗口</text><text x="449" y="146" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#2563eb">查参数、拦危险、问你</text><text x="561" y="146" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#2563eb">压缩、脱敏、记日志</text><text x="506" y="172" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#1f2937">这是代码，不是提示</text><text x="506" y="188" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#6b7280">碰到删除、付款，先停下来问你</text><rect x="370" y="200" width="272" height="24" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/><text x="506" y="216" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#15803d">百分之百执行</text><text x="24" y="272" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">提示是嘱咐，关卡是门禁。你觉得某个助手"稳"，多半是它门禁多。</text></svg>