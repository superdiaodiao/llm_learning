<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="1360" height="880">
<rect width="680" height="440" fill="#ffffff"/>
<text x="20" y="24" font-family="Noto Sans CJK SC" font-size="13" fill="#1f2937" text-anchor="start" font-weight="600">RAG 主流程（不变的部分）</text>
<rect x="20" y="36" width="110" height="40" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="75" y="61" font-family="Noto Sans CJK SC" font-size="12" fill="#4b5563" text-anchor="middle">问题</text>
<line x1="130" y1="56" x2="156" y2="56" stroke="#9ca3af" stroke-width="1.6"/>
<polygon points="156,56 148.0,52.0 148.0,60.0" fill="#9ca3af"/>
<rect x="158" y="36" width="150" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="233" y="61" font-family="Noto Sans CJK SC" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="600">检索器（可插拔）</text>
<line x1="308" y1="56" x2="334" y2="56" stroke="#9ca3af" stroke-width="1.6"/>
<polygon points="334,56 326.0,52.0 326.0,60.0" fill="#9ca3af"/>
<rect x="336" y="36" width="120" height="40" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="396" y="61" font-family="Noto Sans CJK SC" font-size="12" fill="#4b5563" text-anchor="middle">相关资料</text>
<line x1="456" y1="56" x2="482" y2="56" stroke="#9ca3af" stroke-width="1.6"/>
<polygon points="482,56 474.0,52.0 474.0,60.0" fill="#9ca3af"/>
<rect x="484" y="36" width="90" height="40" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="529" y="61" font-family="Noto Sans CJK SC" font-size="12" fill="#4b5563" text-anchor="middle">拼进提示</text>
<line x1="574" y1="56" x2="600" y2="56" stroke="#9ca3af" stroke-width="1.6"/>
<polygon points="600,56 592.0,52.0 592.0,60.0" fill="#9ca3af"/>
<rect x="602" y="36" width="58" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="631" y="61" font-family="Noto Sans CJK SC" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="600">LLM</text>
<line x1="233" y1="76" x2="233" y2="104" stroke="#9ca3af" stroke-width="1.6"/>
<polygon points="233,104 237.0,96.0 229.0,96.0" fill="#9ca3af"/>
<text x="20" y="126" font-family="Noto Sans CJK SC" font-size="13" fill="#1f2937" text-anchor="start" font-weight="600">“检索器”可以换成任何一种（都算 RAG）</text>
<rect x="20" y="140" width="200" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="120" y="164" font-family="Noto Sans CJK SC" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="600">向量库（语义检索）</text>
<text x="120" y="184" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="middle">按“意思相近”找</text>
<rect x="240" y="140" width="200" height="60" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="340" y="164" font-family="Noto Sans CJK SC" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="600">关键词 / 全文检索</text>
<text x="340" y="184" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="middle">BM25 · Elasticsearch · 无向量</text>
<rect x="460" y="140" width="200" height="60" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="560" y="164" font-family="Noto Sans CJK SC" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="600">SQL 查数据库</text>
<text x="560" y="184" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="middle">按条件查结构化表</text>
<rect x="20" y="210" width="200" height="60" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="120" y="234" font-family="Noto Sans CJK SC" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="600">网页 / 搜索 API</text>
<text x="120" y="254" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="middle">Google · Bing · 实时</text>
<rect x="240" y="210" width="200" height="60" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="340" y="234" font-family="Noto Sans CJK SC" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="600">API 调用</text>
<text x="340" y="254" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="middle">天气 · 内部服务 · 文档</text>
<rect x="460" y="210" width="200" height="60" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="560" y="234" font-family="Noto Sans CJK SC" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="600">直接塞整份文档</text>
<text x="560" y="254" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="middle">上下文放得下就不用“搜”</text>
<rect x="20" y="292" width="640" height="132" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="34" y="316" font-family="Noto Sans CJK SC" font-size="13" fill="#1f2937" text-anchor="start" font-weight="600">两个澄清</text>
<text x="34" y="340" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">· RAG ≠ 知识库。知识库是“数据源”；RAG 是“提问时取回相关资料、塞进提示”这个“做法”。</text>
<text x="34" y="362" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">  知识库常是 RAG 检索的对象之一，但 RAG 也能检索数据库、网页、API、聊天记录……</text>
<text x="34" y="384" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">· 不用向量库也算 RAG。R = Retrieval，任何“取回相关外部信息”的方式都算，向量只是其中最流行的一种。</text>
<text x="34" y="408" font-family="Noto Sans CJK SC" font-size="11" fill="#2563eb" text-anchor="start" font-weight="600">· 本质：把“模型权重里没有的、可更新的外部知识”在运行时喂进去——怎么取，是实现细节。</text>
</svg>
