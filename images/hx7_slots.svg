<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 312" width="1360" height="624" role="img" aria-label="三个口子：规则每轮固定进放几个月不变的；记忆捞相关几条进放会变但下次还用的；每次说只进这一轮放一次性的"><rect width="680" height="312" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">三个口子，进窗口的时机不一样</text><rect x="24" y="60" width="204" height="200" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="126" y="84" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#2563eb">规则</text><text x="126" y="102" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#1f2937">每一轮开头固定进</text><rect x="38" y="112" width="176" height="20" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/><text x="126" y="126" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#2563eb">几个月不变的</text><rect x="38" y="144" width="176" height="19" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="126" y="157.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1f2937">用中文回复</text><rect x="38" y="170" width="176" height="19" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="126" y="183.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1f2937">我是做市场的</text><rect x="38" y="196" width="176" height="19" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="126" y="209.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1f2937">别动 migrations/</text><text x="126" y="244" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#6b7280">写规则文件 / 自定义指令</text><rect x="238" y="60" width="204" height="200" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="340" y="84" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#2563eb">记忆</text><text x="340" y="102" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#1f2937">捞相关的几条进</text><rect x="252" y="112" width="176" height="20" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/><text x="340" y="126" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#2563eb">会变、下次还用的</text><rect x="252" y="144" width="176" height="19" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="340" y="157.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1f2937">在做 Q4 活动方案</text><rect x="252" y="170" width="176" height="19" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="340" y="183.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1f2937">最近在学 Rust</text><rect x="252" y="196" width="176" height="19" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="340" y="209.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1f2937">周报用三段式</text><text x="340" y="244" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#6b7280">"记住：……" / 记忆列表</text><rect x="452" y="60" width="204" height="200" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="554" y="84" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#2563eb">每次说</text><text x="554" y="102" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#1f2937">只进这一轮</text><rect x="466" y="112" width="176" height="20" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/><text x="554" y="126" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#2563eb">只这一次的</text><rect x="466" y="144" width="176" height="19" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="554" y="157.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1f2937">今天给客户看</text><rect x="466" y="170" width="176" height="19" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="554" y="183.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1f2937">【材料】……</text><rect x="466" y="196" width="176" height="19" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="554" y="209.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1f2937">这次不超过 200 字</text><text x="554" y="244" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#6b7280">当轮消息，四个部件</text><text x="24" y="294" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">判断只看一件事：这句话多久变一次。放错口子：写规则会过时，靠记忆会记串，每次说会烦。</text></svg>