<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="1360" height="600" role="img" aria-label="模型的一生五步：预训练、指令微调、对齐、推理训练，同一个动作，变的是对答案的方式"><rect width="680" height="300" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">模型的一生，五步走完</text><rect x="24" y="96" width="112" height="44" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="80" y="122.68" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#6b7280">随机数</text><rect x="154" y="96" width="112" height="44" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="210" y="122.68" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2937">会接话</text><rect x="284" y="96" width="112" height="44" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="340" y="122.68" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2937">会按格式答</text><rect x="414" y="96" width="112" height="44" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="470" y="122.68" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2937">会挑好回答</text><rect x="544" y="96" width="112" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="600" y="122.68" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#2563eb">会先想再答</text><line x1="138" y1="118" x2="152" y2="118" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><text x="145" y="82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="600" fill="#be123c">预训练</text><text x="145" y="164" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280">像不像原文</text><line x1="268" y1="118" x2="282" y2="118" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><text x="275" y="82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="600" fill="#be123c">指令微调</text><text x="275" y="164" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280">像不像对话</text><line x1="398" y1="118" x2="412" y2="118" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><text x="405" y="82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="600" fill="#be123c">对齐</text><text x="405" y="164" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280">人选了哪个</text><line x1="528" y1="118" x2="542" y2="118" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><text x="535" y="82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="600" fill="#be123c">推理训练</text><text x="535" y="164" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280">答案对不对</text><text x="24" y="200" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">"对答案"用什么 →</text><text x="24" y="240" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2937">五步，同一个动作：猜、对答案、挪数字。变的只是"对答案"用的是什么。</text><text x="24" y="266" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937">推理训练只能在有标准答案的题上做，所以它数学、代码最强，写文案一般。</text></svg>