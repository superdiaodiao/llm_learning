<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 354" width="1360" height="708" role="img" aria-label="Agent 循环：模型读到工具表后只写一行调用文字，程序执行并把结果写回窗口，模型再读再写，直到不再写调用"><rect width="680" height="354" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">它只吐字，手是程序的</text><rect x="24" y="62" width="300" height="250" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="174" y="84" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937">窗口里（模型看到的全部）</text><rect x="38" y="96" width="272" height="34" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3"/><text x="48" y="110" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">工具表：查天气（填城市）· 设闹钟（填时间）</text><text x="48" y="124" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">　　　　· 发消息（填收件人、内容）</text><rect x="38" y="140" width="272" height="21" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="48" y="154.5" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.8" font-weight="400" fill="#1f2937">你：明天北京要下雨就把闹钟提前半小时</text><rect x="38" y="167" width="272" height="21" rx="3" fill="#ffe4e6" stroke="#be123c" stroke-width="1.2"/><text x="48" y="181.5" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.8" font-weight="600" fill="#be123c">模型：调 查天气，城市 = 北京</text><rect x="38" y="194" width="272" height="21" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="48" y="208.5" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.8" font-weight="600" fill="#2563eb">程序：明天北京，中雨</text><rect x="38" y="221" width="272" height="21" rx="3" fill="#ffe4e6" stroke="#be123c" stroke-width="1.2"/><text x="48" y="235.5" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.8" font-weight="600" fill="#be123c">模型：调 设闹钟，时间 = 6:30</text><rect x="38" y="248" width="272" height="21" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="48" y="262.5" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.8" font-weight="600" fill="#2563eb">程序：已设</text><rect x="38" y="275" width="272" height="21" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="48" y="289.5" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.8" font-weight="400" fill="#1f2937">模型：明天有雨，闹钟提前到 6:30。</text><rect x="473" y="64" width="74" height="28" rx="14" fill="#ffe4e6" stroke="#be123c" stroke-width="1.4"/><text x="510" y="82.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#be123c">想</text><rect x="565" y="156" width="74" height="28" rx="14" fill="#ffe4e6" stroke="#be123c" stroke-width="1.4"/><text x="602" y="174.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#be123c">写一行调用</text><rect x="473" y="248" width="74" height="28" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="510" y="266.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#2563eb">程序执行</text><rect x="381" y="156" width="74" height="28" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="418" y="174.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#2563eb">结果回填</text><path d="M 542.409 83.8975 A 92 92 0 0 1 596.103 137.591" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#ah)"/><path d="M 596.103 202.409 A 92 92 0 0 1 542.409 256.103" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#ah)"/><path d="M 477.591 256.103 A 92 92 0 0 1 423.897 202.409" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#ah)"/><path d="M 423.897 137.591 A 92 92 0 0 1 477.591 83.8975" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#ah)"/><text x="510" y="164" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#be123c">模型只写字</text><text x="510" y="182" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#2563eb">程序才动手</text><text x="510" y="292" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#6b7280">不再写调用、改写给你的话，就停</text><text x="24" y="336" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">"调 查天气"只是一行文字。窗口外有个程序盯着这种格式，看到就真的去调，结果写回窗口，模型再读一遍。</text></svg>