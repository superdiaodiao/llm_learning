<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" width="1360" height="620" role="img" aria-label="潜空间扩散：先把图压小 8 倍，撒噪去噪全在小草图上做，最后解码放大回像素；代价是细节糊"><rect width="680" height="310" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">先压小，画完再放大</text><rect x="24" y="70" width="130" height="130" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="89" y="140" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#1f2937">512 × 512</text><text x="89" y="156" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">几十万像素</text><text x="89" y="220" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#be123c">直接画：太贵</text><line x1="160" y1="135" x2="196" y2="135" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/><text x="178" y="124" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#2563eb">压 8 倍</text><rect x="210" y="118" width="34" height="34" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="227" y="176" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, monospace" font-size="10" font-weight="600" fill="#2563eb">64 × 64</text><text x="227" y="192" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">"草图"</text><line x1="252" y1="135" x2="288" y2="135" stroke="#be123c" stroke-width="2.5" marker-end="url(#ar)"/><rect x="300" y="90" width="190" height="90" rx="8" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><text x="395" y="118" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#be123c">撒噪点、去噪点</text><text x="395" y="138" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#1f2937">全在这张小草图上做</text><text x="395" y="156" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#1f2937">算的量少几十倍</text><text x="395" y="200" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#15803d">所以普通显卡能跑</text><line x1="496" y1="135" x2="532" y2="135" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/><text x="514" y="124" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#2563eb">放大</text><rect x="540" y="70" width="116" height="130" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><rect x="556" y="130" width="84" height="50" rx="3" fill="#2563eb"/><path d="M 552 130 L 598 86 L 644 130 Z" fill="#9ca3af"/><circle cx="626" cy="98" r="8" fill="#be123c"/><text x="598" y="220" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#6b7280">最后一步解码回像素</text><rect x="24" y="246" width="632" height="46" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="340" y="264" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#1f2937">代价：压缩有损。小字、细密纹理、手指这些细节容易糊。</text><text x="340" y="282" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">早期 AI 画不好手，一部分就是这里来的；招牌上的字写错，也是。</text></svg>