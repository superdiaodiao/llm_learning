<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="1360" height="680" role="img" aria-label="每吐一个词都要把几十亿个数字从内存搬到计算单元；一人一词最浪费，拼车让搬一次算几十个词"><rect width="680" height="340" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">贵的不是算，是搬</text><rect x="24" y="72" width="150" height="120" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="99" y="96" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">显卡内存</text><text x="99" y="118" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">几十亿个数字</text><rect x="40" y="130" width="22" height="12" rx="2" fill="#e5e7eb" stroke="#9ca3af" stroke-width="0.8"/><rect x="64" y="130" width="22" height="12" rx="2" fill="#e5e7eb" stroke="#9ca3af" stroke-width="0.8"/><rect x="88" y="130" width="22" height="12" rx="2" fill="#e5e7eb" stroke="#9ca3af" stroke-width="0.8"/><rect x="112" y="130" width="22" height="12" rx="2" fill="#e5e7eb" stroke="#9ca3af" stroke-width="0.8"/><rect x="136" y="130" width="22" height="12" rx="2" fill="#e5e7eb" stroke="#9ca3af" stroke-width="0.8"/><rect x="40" y="147" width="22" height="12" rx="2" fill="#e5e7eb" stroke="#9ca3af" stroke-width="0.8"/><rect x="64" y="147" width="22" height="12" rx="2" fill="#e5e7eb" stroke="#9ca3af" stroke-width="0.8"/><rect x="88" y="147" width="22" height="12" rx="2" fill="#e5e7eb" stroke="#9ca3af" stroke-width="0.8"/><rect x="112" y="147" width="22" height="12" rx="2" fill="#e5e7eb" stroke="#9ca3af" stroke-width="0.8"/><rect x="136" y="147" width="22" height="12" rx="2" fill="#e5e7eb" stroke="#9ca3af" stroke-width="0.8"/><rect x="40" y="164" width="22" height="12" rx="2" fill="#e5e7eb" stroke="#9ca3af" stroke-width="0.8"/><rect x="64" y="164" width="22" height="12" rx="2" fill="#e5e7eb" stroke="#9ca3af" stroke-width="0.8"/><rect x="88" y="164" width="22" height="12" rx="2" fill="#e5e7eb" stroke="#9ca3af" stroke-width="0.8"/><rect x="112" y="164" width="22" height="12" rx="2" fill="#e5e7eb" stroke="#9ca3af" stroke-width="0.8"/><rect x="136" y="164" width="22" height="12" rx="2" fill="#e5e7eb" stroke="#9ca3af" stroke-width="0.8"/><line x1="182" y1="132" x2="238" y2="132" stroke="#be123c" stroke-width="3" marker-end="url(#ar)"/><text x="210" y="120" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#be123c">搬</text><text x="210" y="152" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280">慢</text><rect x="246" y="72" width="120" height="120" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="306" y="96" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="600" fill="#2563eb">计算单元</text><text x="306" y="118" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">算得极快</text><text x="306" y="156" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#1f2937">算出一个词</text><text x="400" y="82" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#be123c">一人一词</text><text x="400" y="100" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">搬一次几十亿个数字，只算 1 个词</text><rect x="400" y="108" width="40" height="24" rx="4" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><text x="420" y="123.96" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#be123c">词</text><text x="400" y="160" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#2563eb">拼车（批处理）</text><text x="400" y="178" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">搬一次，几十个人各算 1 个词</text><rect x="400" y="186" width="40" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="420" y="201.96" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#2563eb">词</text><rect x="444" y="186" width="40" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="464" y="201.96" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#2563eb">词</text><rect x="488" y="186" width="40" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="508" y="201.96" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#2563eb">词</text><rect x="532" y="186" width="40" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="552" y="201.96" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#2563eb">词</text><rect x="576" y="186" width="40" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="596" y="201.96" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#2563eb">词</text><rect x="620" y="186" width="40" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="640" y="201.96" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#2563eb">词</text><line x1="24" y1="228" x2="656" y2="228" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><text x="24" y="258" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2937">每吐一个词，大部分时间不是在算，是在等数字搬过来。搬一次是固定开销。</text><text x="24" y="284" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937">所以拼车是所有省钱办法的底子；先答完的立刻下车、等着的立刻上车，座位永远满着。</text><text x="24" y="310" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">（每一步重新上下客叫连续批处理。高峰期变慢，就是车满了在排队。）</text></svg>