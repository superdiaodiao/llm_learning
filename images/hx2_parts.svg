<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 348" width="1360" height="696" role="img" aria-label="一句话要求让它四样都靠猜；拆成任务、格式、材料、例子四个部件，要求放两头材料放中间"><rect width="680" height="348" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">一句话，和四个部件</text><text x="24" y="72" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">现在</text><rect x="24" y="82" width="270" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3"/><text x="36" y="104" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#1f2937">"帮我写个周报。"</text><rect x="24" y="132" width="270" height="20" rx="3" fill="#ffe4e6" stroke="#be123c" stroke-width="1.1"/><text x="36" y="146" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#be123c">格式？它猜一个</text><rect x="24" y="158" width="270" height="20" rx="3" fill="#ffe4e6" stroke="#be123c" stroke-width="1.1"/><text x="36" y="172" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#be123c">重点？它猜一个</text><rect x="24" y="184" width="270" height="20" rx="3" fill="#ffe4e6" stroke="#be123c" stroke-width="1.1"/><text x="36" y="198" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#be123c">给谁看？它猜一个</text><rect x="24" y="210" width="270" height="20" rx="3" fill="#ffe4e6" stroke="#be123c" stroke-width="1.1"/><text x="36" y="224" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#be123c">语气？它猜一个</text><text x="24" y="254" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#1f2937">四样都靠猜，猜对一样的概率就不高，</text><text x="24" y="272" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#1f2937">四样全猜对更低。所以改三轮。</text><line x1="326" y1="62" x2="326" y2="290" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><text x="352" y="72" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">四个部件</text><rect x="352" y="82" width="304" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/><text x="364" y="99" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#2563eb">任务</text><text x="420" y="99" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#1f2937">给直属领导看，五分钟读完</text><rect x="352" y="114" width="304" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/><text x="364" y="131" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#2563eb">格式</text><text x="420" y="131" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#1f2937">三部分、每条一句话、200 字</text><rect x="352" y="146" width="304" height="56" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3"/><text x="364" y="163" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#1f2937">材料</text><text x="420" y="163" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#6b7280">日程、聊天记录、提交记录……</text><rect x="352" y="208" width="304" height="40" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3"/><text x="364" y="225" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#1f2937">例子</text><text x="420" y="225" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#6b7280">上周那份，照这个风格</text><rect x="352" y="254" width="304" height="24" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/><text x="364" y="271" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#2563eb">再说一遍</text><text x="420" y="271" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#1f2937">三部分、200 字、只输出周报</text><text x="352" y="302" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#1f2937">要求放两头，它记得最牢；材料再长也放中间。</text><text x="24" y="332" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">一份例子顶一段描述：它靠"环顾四周找相近的"干活，照着来比照着形容词准得多。</text></svg>