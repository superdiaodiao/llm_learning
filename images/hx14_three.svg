<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 334" width="1360" height="668" role="img" aria-label="聊久了窗口满：最早的要求被挤走或埋在中间；三个动作：新开、压缩后新开、把大任务拆开只带结论回来"><rect width="680" height="334" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">窗口满了：新开、压缩、拆</text><rect x="24" y="56" width="632" height="44" rx="6" fill="#ffffff" stroke="#be123c" stroke-width="1.3"/><rect x="32" y="64" width="56" height="28" rx="3" fill="#ffe4e6" stroke="#be123c" stroke-width="1"/><text x="60" y="82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="600" fill="#be123c">最早的要求</text><rect x="92" y="64" width="36" height="28" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="110" y="82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#6b7280">回答</text><rect x="132" y="64" width="86" height="28" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="175" y="82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#6b7280">读的文件</text><rect x="222" y="64" width="116" height="28" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="280" y="82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#6b7280">命令输出</text><rect x="342" y="64" width="36" height="28" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="360" y="82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#6b7280">回答</text><rect x="382" y="64" width="66" height="28" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="415" y="82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#6b7280">文件</text><rect x="452" y="64" width="86" height="28" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="495" y="82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#6b7280">输出</text><rect x="542" y="64" width="36" height="28" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="560" y="82" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="600" fill="#2563eb">现在</text><text x="340" y="116" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#6b7280">第四十轮：最早的要求被挤到边上、埋在中间，每条分到的注意力越来越少</text><rect x="24" y="134" width="204" height="150" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="126" y="158" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#2563eb">新开</text><rect x="38" y="168" width="176" height="20" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/><text x="126" y="182" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#2563eb">它开始忘、重复、答非所问</text><text x="126" y="208" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1f2937">新开一个对话</text><text x="126" y="226" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1f2937">把三五条要求原样贴过去</text><text x="126" y="244" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">看不见的上下文留着也没用</text><rect x="238" y="134" width="204" height="150" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="340" y="158" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#2563eb">压缩</text><rect x="252" y="168" width="176" height="20" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/><text x="340" y="182" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#2563eb">做到一半，进展要保留</text><text x="340" y="208" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1f2937">让它写一段交接：做了什么、</text><text x="340" y="226" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1f2937">决定了什么、还剩什么</text><text x="340" y="244" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">拿着交接新开，主动压比等它压好</text><rect x="452" y="134" width="204" height="150" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="554" y="158" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#2563eb">拆</text><rect x="466" y="168" width="176" height="20" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/><text x="554" y="182" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#2563eb">一看就要读很多东西</text><text x="554" y="208" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1f2937">拆成几个小任务</text><text x="554" y="226" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1f2937">各开一个对话或派给子任务</text><text x="554" y="244" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">只把结论带回主窗口</text><text x="24" y="316" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">一个对话只干一件事，干完就关。它没忘，是没看见；喊"你忘了吗"没用，把要求重新放进窗口才有用。</text></svg>