<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="1360" height="680" role="img" aria-label="查资料：提问时把相关资料放进窗口，它此刻就能看见；不动任何数字，资料改了换一份"><rect width="680" height="340" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">查资料：放进窗口，它就"知道"了</text><rect x="24" y="72" width="180" height="150" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3"/><text x="114" y="94" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">你的一堆资料</text><rect x="40" y="104" width="148" height="18" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="114" y="116.78" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#6b7280">产品手册</text><rect x="40" y="126" width="148" height="18" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="114" y="138.78" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#2563eb">内部术语表</text><rect x="40" y="148" width="148" height="18" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="114" y="160.78" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#6b7280">本月政策</text><rect x="40" y="170" width="148" height="18" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="114" y="182.78" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#6b7280">历史工单</text><rect x="40" y="192" width="148" height="18" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="114" y="204.78" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#6b7280">……</text><line x1="210" y1="147" x2="250" y2="147" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/><text x="230" y="136" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#6b7280">捞相关的</text><rect x="258" y="72" width="398" height="150" rx="12" fill="#fcfcfd" stroke="#2563eb" stroke-width="2"/><text x="457" y="94" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#2563eb">窗口（它此刻能看到的全部）</text><rect x="276" y="108" width="150" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="351" y="132.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="600" fill="#2563eb">内部术语表</text><rect x="436" y="108" width="204" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="538" y="132.32" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#1f2937">你的问题：XX 是什么意思</text><text x="457" y="176" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#1f2937">资料在窗口里，它就"知道"了。不用动任何一个数字。</text><text x="457" y="198" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#1f2937">资料改了，换一份就行。</text><line x1="24" y1="248" x2="656" y2="248" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><text x="24" y="278" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">想让它知道新东西，走这条路。代价：每次都要带着，占窗口；捞得准不准是另一门手艺。</text><text x="24" y="304" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">（先捞再放的整套做法叫 RAG，后面一课专门讲。）</text></svg>