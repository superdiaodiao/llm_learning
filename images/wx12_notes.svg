<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 336" width="1360" height="672" role="img" aria-label="同一句话的记错与记对：具体的别概括、时间落地、别曲解、不许猜、拿不准就记"><rect width="680" height="336" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">同一句话，记对和记错</text><text x="119" y="66" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#6b7280">你说的</text><text x="333" y="66" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#be123c">记错</text><text x="547" y="66" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#15803d">记对</text><rect x="24" y="78" width="190" height="34" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.3"/><text x="119" y="100" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1f2937">我上周开着我那台 488 去了趟巴黎</text><rect x="238" y="78" width="190" height="34" rx="4" fill="#ffe4e6" stroke="#be123c" stroke-width="1.3"/><text x="333" y="100" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#be123c">上周开车去了巴黎</text><rect x="452" y="78" width="190" height="34" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/><text x="547" y="100" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#15803d">9 月 6 日开法拉利 488 去了巴黎</text><text x="547" y="124" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">具体的别概括；时间落地</text><rect x="24" y="134" width="190" height="34" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.3"/><text x="119" y="156" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1f2937">昨晚两点前都没睡着</text><rect x="238" y="134" width="190" height="34" rx="4" fill="#ffe4e6" stroke="#be123c" stroke-width="1.3"/><text x="333" y="156" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#be123c">睡到两点</text><rect x="452" y="134" width="190" height="34" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/><text x="547" y="156" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#15803d">昨晚两点前没睡着</text><text x="547" y="180" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">别曲解</text><rect x="24" y="190" width="190" height="34" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.3"/><text x="119" y="212" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1f2937">我叫 Chris，在一家医院上班</text><rect x="238" y="190" width="190" height="34" rx="4" fill="#ffe4e6" stroke="#be123c" stroke-width="1.3"/><text x="333" y="212" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#be123c">男性，医生</text><rect x="452" y="190" width="190" height="34" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/><text x="547" y="212" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#15803d">名字 Chris；在医院上班</text><text x="547" y="236" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">不许猜</text><rect x="24" y="246" width="190" height="34" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.3"/><text x="119" y="268" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1f2937">顺便说一句，我不吃香菜</text><rect x="238" y="246" width="190" height="34" rx="4" fill="#ffe4e6" stroke="#be123c" stroke-width="1.3"/><text x="333" y="268" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#be123c">（跳过）</text><rect x="452" y="246" width="190" height="34" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/><text x="547" y="268" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#15803d">不吃香菜</text><text x="547" y="292" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">拿不准就记</text><text x="24" y="318" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">决定记什么的不是算法，是一份几千字的说明书。每一条都是踩过的坑。换一份说明书，"记性"就变了。</text></svg>