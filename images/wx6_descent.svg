<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="1360" height="680" role="img" aria-label="损失地形像一座山，训练是闭着眼顺坡往下挪，每步一丁点，重复几万亿次"><rect width="680" height="340" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">猜错了，就把数字往"惊讶更小"的方向挪一丁点</text><line x1="70" y1="240" x2="640" y2="240" stroke="#9ca3af" stroke-width="1.4"/><line x1="70" y1="70" x2="70" y2="240" stroke="#9ca3af" stroke-width="1.4"/><text x="62" y="160" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">惊讶</text><text x="62" y="176" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">程度</text><text x="640" y="260" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">几十亿个数字怎么改 →</text><path d="M 90.0 100.0 L 95.1 102.0 L 100.2 104.0 L 105.3 106.0 L 110.4 107.9 L 115.5 109.9 L 120.6 111.8 L 125.7 113.7 L 130.8 115.6 L 135.9 117.5 L 141.0 119.4 L 146.1 121.2 L 151.2 123.0 L 156.3 124.9 L 161.4 126.7 L 166.5 128.5 L 171.6 130.3 L 176.7 132.0 L 181.8 133.8 L 186.9 135.5 L 192.0 137.3 L 197.1 139.0 L 202.2 140.7 L 207.3 142.3 L 212.4 144.0 L 217.5 145.6 L 222.6 147.3 L 227.7 148.9 L 232.8 150.5 L 237.9 152.1 L 243.0 153.6 L 248.1 155.2 L 253.2 156.7 L 258.3 158.3 L 263.4 159.8 L 268.5 161.3 L 273.6 162.7 L 278.7 164.2 L 283.8 165.6 L 288.9 167.1 L 294.0 168.5 L 299.1 