<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="1360" height="680" role="img" aria-label="同一句「帮我改一下」：同事脑子里有你、有这段的用途、有常识；AI 只看到窗口里的文字"><rect width="680" height="340" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">同一句"帮我改一下"，两边听到的不一样</text><text x="24" y="76" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">同事听到的</text><rect x="24" y="84" width="130" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="89" y="108.68" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#1f2937">"帮我改一下"</text><text x="89" y="150" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">＋ 脑子里已经有的</text><rect x="24" y="160" width="130" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="89" y="179.32" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#2563eb">你是谁</text><rect x="24" y="200" width="130" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="89" y="219.32" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#2563eb">这段是干嘛的</text><rect x="24" y="240" width="150" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="99" y="259.32" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#2563eb">"改一下"通常指什么</text><text x="24" y="300" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2937">你说半句，他补另一半。</text><line x1="220" y1="64" x2="220" y2="312" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><text x="248" y="76" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">AI 看到的</text><rect x="248" y="84" width="408" height="118" rx="10" fill="#fcfcfd" stroke="#2563eb" stroke-width="2"/><text x="452" y="104" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="600" fill="#2563eb">上下文窗口（此刻能看到的全部）</text><rect x="264" y="116" width="120" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="324" y="137.32" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">之前聊的</text><rect x="392" y="116" width="120" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="452" y="137.32" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">……</text><rect x="520" y="116" width="120" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="580" y="137.32" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#1f2937">"帮我改一下"</text><text x="452" y="180" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">每轮从头读一遍，读完就忘；装满了最早的先出去</text><rect x="248" y="222" width="126" height="30" rx="6" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5" stroke-dasharray="4 3"/><text x="311" y="241.32" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#be123c">你是谁？</text><rect x="386" y="222" width="126" height="30" rx="6" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5" stroke-dasharray="4 3"/><text x="449" y="241.32" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#be123c">给谁看？</text><rect x="524" y="222" width="126" height="30" rx="6" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5" stroke-dasharray="4 3"/><text x="587" y="241.32" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#be123c">改成什么样？</text><text x="248" y="300" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2937">窗口里没有的，它不会问，它会猜。</text></svg>