<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="1360" height="800" role="img" aria-label="男人到国王 与 女人到女王 是两条平行等长的箭头"><rect width="680" height="400" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">两条箭头，一样长、一样的方向</text><rect x="24" y="56" width="632" height="254" rx="12" fill="#fcfcfd" stroke="#9ca3af" stroke-width="1.2"/><path d="M150 268 L270 116 L520 116 L400 268 Z" fill="#f3f4f6" opacity="0.35"/><line x1="150" y1="268" x2="270" y2="116" stroke="#be123c" stroke-width="2.4" marker-end="url(#ar)"/><line x1="400" y1="268" x2="520" y2="116" stroke="#be123c" stroke-width="2.4" marker-end="url(#ar)"/><text x="196" y="186" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#be123c">+ 王室</text><text x="446" y="186" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#be123c">+ 王室</text><circle cx="150" cy="268" r="5.5" fill="#6b7280"/><text x="150" y="294" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#1f2937">男人</text><circle cx="270" cy="116" r="5.5" fill="#6b7280"/><text x="270" y="100" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#1f2937">国王</text><circle cx="400" cy="268" r="5.5" fill="#6b7280"/><text x="400" y="294" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#1f2937">女人</text><circle cx="520" cy="116" r="5.5" fill="#6b7280"/><text x="520" y="100" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#1f2937">女王</text><text x="340" y="350" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#be123c">国王 − 男人 + 女人 ≈ 女王</text><text x="340" y="378" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280">这条关系没有任何人写进去过</text></svg>