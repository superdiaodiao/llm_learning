<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="1360" height="1000">
<rect width="680" height="500" fill="#ffffff"/>
<rect x="20" y="34" width="280" height="42" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="34" y="52" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">t1  用户："我平时用 Python"</text>
<text x="34" y="69" font-family="Noto Sans CJK SC" font-size="11" fill="#2563eb" text-anchor="start" font-weight="600">→ ADD 记忆#7 "用户主要用 Python 编程"</text>
<rect x="20" y="86" width="280" height="30" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="34" y="105" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">t2  用户："现在改用 Rust 了" —— 怎么办？</text>
<text x="20" y="146" font-family="Noto Sans CJK SC" font-size="13" fill="#1f2937" text-anchor="start" font-weight="600">同一件事，两种设计哲学</text>
<rect x="20" y="158" width="315" height="96" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
<text x="34" y="180" font-family="Noto Sans CJK SC" font-size="12" fill="#1f2937" text-anchor="start" font-weight="600">经典设计：UPDATE（原地改）</text>
<text x="34" y="202" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="start">_update_memory(id=#7, ...)</text>
<text x="34" y="222" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">同一个 id 改内容，created_at 保留，</text>
<text x="34" y="240" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">旧值进 history。→ 覆盖，只留一条</text>
<rect x="345" y="158" width="315" height="96" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="359" y="180" font-family="Noto Sans CJK SC" font-size="12" fill="#1f2937" text-anchor="start" font-weight="600">V3 新设计：additive（追加+关联）</text>
<text x="359" y="202" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="start">ADD 记忆#12, linked_memory_ids=[#7]</text>
<text x="359" y="222" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">新增一条"从 Python 转向 Rust"，</text>
<text x="359" y="240" font-family="Noto Sans CJK SC" font-size="11" fill="#2563eb" text-anchor="start" font-weight="600">用链接指回旧的 → 累积，不覆盖，建成图</text>
<text x="20" y="286" font-family="Noto Sans CJK SC" font-size="13" fill="#1f2937" text-anchor="start" font-weight="600">贯穿始终的主线：append-only 历史账本（增/改/删都留痕）</text>
<rect x="20" y="298" width="640" height="92" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="34" y="320" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="start">event      memory_id   old_memory           new_memory             is_deleted</text>
<line x1="34" y1="328" x2="646" y2="328" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2"/>
<text x="34" y="346" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="start">ADD        #7          (null)               用户主要用 Python       0</text>
<text x="34" y="364" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="start">UPDATE   #7          用了 Python          改用 Rust               0</text>
<text x="34" y="382" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="start">DELETE   #7          改用 Rust            (null)                 1  ← 软删除，仍留档</text>
<text x="20" y="418" font-family="Noto Sans CJK SC" font-size="13" fill="#1f2937" text-anchor="start" font-weight="600">底下两层支撑（检索时一起用）</text>
<rect x="20" y="430" width="315" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="34" y="452" font-family="Noto Sans CJK SC" font-size="11" fill="#2563eb" text-anchor="start" font-weight="600">混合检索：向量（语义）+ BM25（关键词）</text>
<text x="34" y="472" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="start">存 embedding，也存 text_lemmatized 供关键词匹配</text>
<rect x="345" y="430" width="315" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="359" y="452" font-family="Noto Sans CJK SC" font-size="11" fill="#2563eb" text-anchor="start" font-weight="600">实体图：spaCy 抽实体，单独一个 _entities 集合</text>
<text x="359" y="472" font-family="Noto Sans CJK SC" font-size="10" fill="#4b5563" text-anchor="start">Python / Rust 作为实体被链接，支持跨记忆检索</text>
</svg>
