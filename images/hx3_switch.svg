<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 314" width="1360" height="628" role="img" aria-label="深度思考开关：一眼能答、改文字、格式转换的关；要几步、要核对、有陷阱的开"><rect width="680" height="314" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">一步能答的关，要几步的开</text><rect x="24" y="62" width="300" height="200" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="174" y="84" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="700" fill="#1f2937">关：一步到位</text><text x="174" y="100" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#6b7280">你自己做不用打草稿的</text><rect x="40" y="112" width="268" height="21" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.1"/><text x="174" y="126.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#1f2937">闲聊、常识问答</text><rect x="40" y="140" width="268" height="21" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.1"/><text x="174" y="154.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#1f2937">润色、翻译、换语气</text><rect x="40" y="168" width="268" height="21" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.1"/><text x="174" y="182.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#1f2937">整理成表格、缩成三句</text><rect x="40" y="196" width="268" height="21" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.1"/><text x="174" y="210.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#1f2937">"这个词什么意思"</text><text x="174" y="244" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#6b7280">开了只是慢，答案不会更好</text><rect x="356" y="62" width="300" height="200" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="506" y="84" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="700" fill="#2563eb">开：先写演算纸</text><text x="506" y="100" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#6b7280">你自己做要打草稿的</text><rect x="372" y="112" width="268" height="21" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/><text x="506" y="126.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#2563eb">排日程、算账、比方案</text><rect x="372" y="140" width="268" height="21" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/><text x="506" y="154.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#2563eb">核对数字、找矛盾、查 bug</text><rect x="372" y="168" width="268" height="21" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/><text x="506" y="182.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#2563eb">题里藏着容易看漏的条件</text><rect x="372" y="196" width="268" height="21" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/><text x="506" y="210.5" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#2563eb">错一步全错的</text><text x="506" y="244" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#6b7280">不开，它就在一步到位地猜</text><text x="24" y="296" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">它没法在心里想，只能写出来想。写在演算纸上的东西它后面看得见，能接着用。</text></svg>