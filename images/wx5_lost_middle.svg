<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="1360" height="680" role="img" aria-label="模型对窗口内容的注意力呈 U 形：开头和结尾记得牢，中间容易丢"><rect width="680" height="340" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">窗口以内，也不平等</text><line x1="90" y1="230" x2="640" y2="230" stroke="#9ca3af" stroke-width="1.4"/><line x1="90" y1="70" x2="90" y2="230" stroke="#9ca3af" stroke-width="1.4"/><text x="80" y="140" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">记得</text><text x="80" y="156" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">多牢</text><text x="640" y="250" text-anchor="end" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280">内容在窗口里的位置 →</text><path d="M100 88 C 230 94, 290 206, 365 204 S 500 92, 630 86" stroke="#be123c" stroke-width="3" fill="none"/><circle cx="100" cy="88" r="6" fill="#be123c" stroke="#ffffff" stroke-width="2"/><rect x="66" y="42" width="68" height="28" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="100" y="60.68" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2937">开头  ✓</text><circle cx="365" cy="204" r="6" fill="#be123c" stroke="#ffffff" stroke-width="2"/><rect x="331" y="236" width="68" height="28" rx="6" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><text x="365" y="254.68" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#be123c">中间  ↓</text><circle cx="630" cy="86" r="6" fill="#be123c" stroke="#ffffff" stroke-width="2"/><rect x="596" y="40" width="68" height="28" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="630" y="58.68" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2937">结尾  ✓</text><text x="24" y="282" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1f2937">开头和结尾记得牢，中间容易丢——研究里叫 lost in the middle。</text><text x="24" y="308" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#1f2937">所以关键要求写在提示的最前面或最后面，别埋在中间。</text></svg>