<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="1360" height="800">
<rect width="680" height="400" fill="#ffffff"/>
<text x="20" y="26" font-family="Noto Sans CJK SC" font-size="14" fill="#1f2937" text-anchor="start" font-weight="600">错误写法（会崩）</text>
<rect x="20" y="38" width="300" height="52" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="34" y="60" font-family="Noto Sans CJK SC" font-size="12" fill="#4b5563" text-anchor="start">document.metadata</text>
<text x="34" y="80" font-family="Noto Sans CJK SC" font-size="12" fill="#2563eb" text-anchor="start" font-weight="600">类型：dict — 有 .get() 方法 ✓</text>
<line x1="170" y1="90" x2="170" y2="114" stroke="#9ca3af" stroke-width="1.6"/>
<polygon points="170,114 174.0,106.0 166.0,106.0" fill="#9ca3af"/>
<text x="182" y="106" font-family="Noto Sans CJK SC" font-size="12" fill="#1f2937" text-anchor="start" font-weight="600">json.dumps( ... )</text>
<rect x="20" y="116" width="300" height="52" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="34" y="138" font-family="Noto Sans CJK SC" font-size="12" fill="#4b5563" text-anchor="start">'{"image_label": "cat"}'</text>
<text x="34" y="158" font-family="Noto Sans CJK SC" font-size="12" fill="#2563eb" text-anchor="start" font-weight="600">类型：str — 没有 .get() 方法 ✗</text>
<line x1="170" y1="168" x2="170" y2="192" stroke="#dc2626" stroke-width="1.6"/>
<polygon points="170,192 174.0,184.0 166.0,184.0" fill="#dc2626"/>
<text x="182" y="184" font-family="Noto Sans CJK SC" font-size="12" fill="#dc2626" text-anchor="start" font-weight="600">.get("image_label")</text>
<rect x="20" y="194" width="300" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="170" y="218" font-family="Noto Sans CJK SC" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="600">AttributeError</text>
<text x="170" y="238" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="middle">'str' object has no attribute 'get'</text>
<text x="360" y="26" font-family="Noto Sans CJK SC" font-size="14" fill="#1f2937" text-anchor="start" font-weight="600">正确写法</text>
<rect x="360" y="38" width="296" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="376" y="60" font-family="Noto Sans CJK SC" font-size="12" fill="#4b5563" text-anchor="start">document.metadata</text>
<text x="376" y="80" font-family="Noto Sans CJK SC" font-size="12" fill="#4b5563" text-anchor="start">保持 dict，不要先 json.dumps</text>
<line x1="508" y1="90" x2="508" y2="114" stroke="#9ca3af" stroke-width="1.6"/>
<polygon points="508,114 512.0,106.0 504.0,106.0" fill="#9ca3af"/>
<text x="520" y="106" font-family="Noto Sans CJK SC" font-size="12" fill="#1f2937" text-anchor="start" font-weight="600">.get("image_label")</text>
<rect x="360" y="116" width="296" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="376" y="138" font-family="Noto Sans CJK SC" font-size="12" fill="#4b5563" text-anchor="start">"cat"</text>
<text x="376" y="158" font-family="Noto Sans CJK SC" font-size="12" fill="#4b5563" text-anchor="start">直接对 dict 取键 → 正常返回</text>
<rect x="20" y="280" width="636" height="104" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="34" y="304" font-family="Noto Sans CJK SC" font-size="12" fill="#1f2937" text-anchor="start" font-weight="600">抓这类 bug 的习惯：给每个表达式在脑子里标注类型，顺着数据流走</text>
<text x="34" y="328" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">遇到 .某方法() 时下意识问一句：点号左边这个东西，此刻是什么类型？它真有这个方法吗？</text>
<text x="34" y="348" font-family="Noto Sans CJK SC" font-size="11" fill="#4b5563" text-anchor="start">这一行位于循环体最上方、任何分支之前 → 每一个 ImageDocument 都必经此处 → 整条图片入库路径 100% 崩。</text>
<text x="34" y="372" font-family="Noto Sans CJK SC" font-size="11" fill="#2563eb" text-anchor="start" font-weight="600">同一行出现在 3 个方法里 → 说明这条路径从没被端到端测试过。</text>
</svg>
