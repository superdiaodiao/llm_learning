 stroke-width="0.8"/><rect x="49" y="122" width="25" height="25" rx="0" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><line x1="61.5" y1="134.5" x2="46" y2="90" stroke="#be123c" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="74" y="197" width="25" height="25" rx="0" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><line x1="86.5" y1="209.5" x2="130" y2="90" stroke="#be123c" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="149" y="147" width="25" height="25" rx="0" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><line x1="161.5" y1="159.5" x2="214" y2="90" stroke="#be123c" stroke-width="1.2" stroke-dasharray="3 3"/><text x="123" y="290" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">去噪的每一步，图上每一块都去"看"每个词</text><text x="123" y="304" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">决定这里该长出什么（第 3 课的环顾四周）</text><text x="24" y="326" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#6b7280">你的描述先变成一串数字，用的是上一课那个"图和话住同一个空间"的模型。</text><rect x="300" y="122" width="356" height="150" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="478" y="144" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1f2937">"提示词相关性"是什么</text><text x="478" y="162" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">训练时故意有时不给描述，它同时学会两种画法</text><rect x="316" y="174" width="100" height="30" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="366" y="193" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#6b7280">没描述怎么画</text><rect x="428" y="174" width="100" height="30" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="478" y="193" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#2563eb">有描述怎么画</text><rect x="540" y="174" width="100" height="30" rx="4" fill="#ffe4e6" stroke="#be123c" stroke-width="1.2"/><text x="590" y="193" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="700" fill="#be123c">差值 × 7</text><text x="422" y="193" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280">→</text><text x="534" y="193" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#6b7280">→</text><text x="478" y="224" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#1f2937">把"因为描述而产生的那部分"放大七倍</text><text x="478" y="240" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">调高：更贴描述、更锐利，也更容易过饱和</text><text x="478" y="256" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">调低：自由散漫，不太听话</text></svg>