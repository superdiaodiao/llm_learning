<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 302" width="1360" height="604" role="img" aria-label="图片经切块编码和一个小翻译器后，整块替换进问题序列里的占位符；之后模型跑的和纯文字一样，不知道哪些字来自图"><rect width="680" height="302" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs><text x="24" y="34" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#1f2937">576 个"图片字"和文字混在一起，它分不出来</text><rect x="24" y="60" width="200" height="46" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3"/><text x="124" y="79" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#1f2937">切块编码</text><text x="124" y="96" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">576 串数字</text><line x1="228" y1="83" x2="238" y2="83" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><rect x="240" y="60" width="200" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/><text x="340" y="79" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#2563eb">小翻译器</text><text x="340" y="96" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">调成文字数字的尺寸</text><line x1="444" y1="83" x2="454" y2="83" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)"/><rect x="456" y="60" width="200" height="46" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3"/><text x="556" y="79" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" fill="#1f2937">整块替换</text><text x="556" y="96" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">塞进你的问题里</text><text x="340" y="124" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#2563eb">唯一新练的是中间那个小翻译器，几百万个数字；聊天模型本身一个数字不动</text><rect x="24" y="146" width="40" height="34" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="44" y="168" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#1f2937">你</text><rect x="66" y="146" width="40" height="34" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="86" y="168" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#1f2937">：</text><rect x="108" y="146" width="40" height="34" rx="4" fill="#ffe4e6" stroke="#be123c" stroke-width="1.2"/><text x="128" y="168" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#be123c">图</text><rect x="150" y="146" width="40" height="34" rx="4" fill="#ffe4e6" stroke="#be123c" stroke-width="1.2"/><text x="170" y="168" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#be123c">图</text><rect x="192" y="146" width="40" height="34" rx="4" fill="#ffe4e6" stroke="#be123c" stroke-width="1.2"/><text x="212" y="168" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#be123c">图</text><rect x="234" y="146" width="40" height="34" rx="4" fill="#ffe4e6" stroke="#be123c" stroke-width="1.2"/><text x="254" y="168" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#be123c">…</text><rect x="276" y="146" width="40" height="34" rx="4" fill="#ffe4e6" stroke="#be123c" stroke-width="1.2"/><text x="296" y="168" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#be123c">图</text><rect x="318" y="146" width="40" height="34" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="338" y="168" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#1f2937">那</text><rect x="360" y="146" width="40" height="34" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="380" y="168" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#1f2937">个</text><rect x="402" y="146" width="40" height="34" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="422" y="168" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#1f2937">人</text><rect x="444" y="146" width="40" height="34" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="464" y="168" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#1f2937">拿</text><rect x="486" y="146" width="40" height="34" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="506" y="168" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#1f2937">的</text><rect x="528" y="146" width="40" height="34" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="548" y="168" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#1f2937">是</text><rect x="570" y="146" width="40" height="34" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="590" y="168" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#1f2937">什</text><rect x="612" y="146" width="40" height="34" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="632" y="168" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#1f2937">么</text><text x="24" y="200" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#1f2937">红色的 576 个位置，原来是一个"图片占位符"，现在被整块换成图的数字。</text><text x="24" y="218" text-anchor="start" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#1f2937">替换完以后，模型跑的和纯文字一模一样。它不知道哪些字来自图片。</text><rect x="24" y="238" width="632" height="46" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="340" y="256" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#1f2937">所以"多模态"的真相很朴素：换一个切块的编码器，接一个翻译器，塞进同一串。</text><text x="340" y="274" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#6b7280">视频是一帧一帧地塞；语音换一个编码器。代价是一张高清图可能占几千个字，窗口要算进去（第 5 课）。</text></svg>